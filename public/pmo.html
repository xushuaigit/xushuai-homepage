<script id="pmoData" type="application/json">{"tree":{"id":"pmo-1","title":"PMO业产研体系","status":"归纳","note":"以业务流为组织载体，以需求和交付为管理主线；PMO准备决策信息、设计共同规则、协调容量与依赖，并通过度量和赋能维持运行。八个分支是从多个案例与试点约定中归纳的体系，不能视为一家企业已经完整实施的统一制度。","children":[{"id":"pmo-2","title":"定位与组织治理","status":"归纳","note":"由多段PMO与敏捷实践归纳；管理层、PMO、业务流与执行团队的职责须分清。跨案例的归纳不表示曾在一家公司原样落地整套体系。","children":[{"id":"pmo-3","title":"PMO职责与决策边界","status":"归纳","note":"PMO负责机制设计、统筹与决策信息准备；最终业务优先级的决策主体按具体组织授权确定。","children":[{"id":"pmo-4","title":"设计机制并监督落地","status":"实践","note":"凹凸经历记录为从零建立企业级PMO，并独立设计、监督组织转型机制落地。","children":[]},{"id":"pmo-5","title":"管理层决定业务优先级","status":"实践","note":"保时捷项目中由管理委员会与各事业部VP决定业务优先级；不能推广为其他组织已确认的授权。","children":[]},{"id":"pmo-6","title":"PMO准备决策信息","status":"实践","note":"准备目标、依赖、容量与风险，作为决策输入方。","children":[]},{"id":"pmo-7","title":"以矩阵协同推动","status":"实践","note":"源材料明确区分协同人数与直属管理人数；仅凹凸记有3名直线成员。","children":[]}]},{"id":"pmo-8","title":"按业务流组织团队","status":"归纳","note":"让稳定团队对业务交付负责，并按场景逐步导入协作机制。","children":[{"id":"pmo-9","title":"产品研发测试稳定配置","status":"实践","note":"按业务流纵向对齐，配置相对稳定的产品、研发与测试角色。","children":[]},{"id":"pmo-10","title":"资源池转为特性团队","status":"实践","note":"由按职能找人转为Feature Team；这是源材料所述组织转型。","children":[]},{"id":"pmo-11","title":"团队对业务交付负责","status":"实践","note":"特性团队直接向业务负责；顾问服务一也采用业务流需求承接。","children":[]},{"id":"pmo-12","title":"从小范围迭代逐步扩展","status":"实践","note":"顾问服务一先在研发侧建立迭代节奏，再扩展至产品与业务协作。","children":[]}]},{"id":"pmo-13","title":"中层与团队的职责分工","status":"规则","note":"本人明确给出自治与收口的划分；这是方法论与再定位方案，未逐条确认其历史实施情况。","children":[{"id":"pmo-14","title":"中层从派人转向供能力","status":"规则","note":"本人提出技术能力组件化、培养人才等中层再定位方向；不得把全部方向写成已实施成果。","children":[]},{"id":"pmo-15","title":"团队方案由业务认可","status":"规则","note":"本人划分：技术治理与标准、技术兜底、质量与稳定性可由团队各有方案，业务认可即可。","children":[]},{"id":"pmo-16","title":"中层收口人才复用规划","status":"规则","note":"本人划分：人员归属与评价、跨团队复用、技术规划与前瞻由中层决策；为已确认观点，非全部落地证明。","children":[]}]},{"id":"pmo-17","title":"中台与共享能力治理","status":"归纳","note":"业务流承担业务交付，共享平台提供跨团队可复用能力。","children":[{"id":"pmo-18","title":"业务团队与平台共同覆盖","status":"实践","note":"叮咚治理范围包括商品、客服，以及中间件、安全、风控、数据、SRE。","children":[]},{"id":"pmo-19","title":"向业务提供可复用能力","status":"实践","note":"源材料记录中台与共享能力治理向业务端提供可复用能力。","children":[]},{"id":"pmo-20","title":"减少跨团队重复建设","status":"目标","note":"这是源材料记录的共享能力治理目的；未给出量化收益，不能当作已测得的结果。","children":[]}]}]},{"id":"pmo-21","title":"业务需求与优先级","status":"归纳","note":"把业务问题转成可评审需求，在全局原则下排序，并显性处理需求变更的代价。","children":[{"id":"pmo-22","title":"业务问题与需求入口","status":"归纳","note":"区分业务痛点与预设方案；统一入口的实践来自顾问服务一。","children":[{"id":"pmo-23","title":"业务先讲问题","status":"规则","note":"原脑图提出双周业务产品会，让业务说清问题，而不是只提出想要的解决方案。","children":[]},{"id":"pmo-24","title":"提前收集一线问题","status":"规则","note":"会议前准备一线使用问题与行业信息，作为需求讨论输入。","children":[]},{"id":"pmo-25","title":"统一需求录入入口","status":"实践","note":"顾问服务一借助Agent在内部系统嵌入需求入口，对接项目管理工具。","children":[]}]},{"id":"pmo-26","title":"公司与业务流双层排序","status":"归纳","note":"全局形成共同原则，业务流在约束内自主决定需求顺序。","children":[{"id":"pmo-27","title":"公司级解决跨流依赖","status":"实践","note":"凹凸公司级机制用于跨业务流与端到端依赖；业务流内部保留自主空间。","children":[]},{"id":"pmo-28","title":"业务流在框架内排序","status":"实践","note":"凹凸战略自上而下对齐，业务流在约束内自主排序需求与交付时间。","children":[]},{"id":"pmo-29","title":"管理会形成优先级原则","status":"实践","note":"叮咚依托管理会形成原则与大纲，再推动跨团队配合。","children":[]}]},{"id":"pmo-30","title":"需求评审与颗粒度","status":"归纳","note":"通过固定评审节奏与需求分层，使研发能够理解、估算和安排工作。","children":[{"id":"pmo-31","title":"双周评审各业务线需求","status":"实践","note":"叮咚每条业务线组织双周需求评审，并建立跨团队需求提前预警。","children":[]},{"id":"pmo-32","title":"区分特性故事与子任务","status":"规则","note":"原脑图将线上故障、特性、故事、子任务、缺陷作为颗粒度类型。","children":[]},{"id":"pmo-33","title":"PRD须让研发清晰理解","status":"规则","note":"原脑图要求交互稿或足以让研发理解的PRD，由研发提出规范要求。","children":[]}]},{"id":"pmo-34","title":"变更与需求置换","status":"归纳","note":"插入需求需要同时处理原计划的影响，避免需求无序叠加。","children":[{"id":"pmo-35","title":"用需求置换处理变更","status":"实践","note":"叮咚把临时需求变更转为规则化需求置换；材料未给出置换批准与计算细则。","children":[]},{"id":"pmo-36","title":"书面记录插入影响","status":"规则","note":"原流程要求记录插入导致哪些需求延期，并由产品说明排期影响。","children":[]},{"id":"pmo-37","title":"回到需求池重新排序","status":"规则","note":"原流程列出重新进入需求池排优先级；仅据文本提炼，不补画未确认的流程连线。","children":[]}]}]},{"id":"pmo-38","title":"容量计划与依赖","status":"归纳","note":"让需求计划与真实团队供给匹配，按节奏推进，并把跨团队依赖和风险送达责任人。","children":[{"id":"pmo-39","title":"容量与估算","status":"归纳","note":"容量数字与估算方法来自叮咚案例，不作为所有团队的固定比例。","children":[{"id":"pmo-40","title":"团队与需求人天匹配","status":"实践","note":"本人提出容量规划方案，各团队结合实际落地，以总人天与需求所需人天匹配。","children":[]},{"id":"pmo-41","title":"预留技术容量10%至15%","status":"实践","note":"叮咚整体排期预留10%–15%给技术需求；这是案例口径。","children":[]},{"id":"pmo-42","title":"估算随需求澄清细化","status":"实践","note":"需求不清晰时按周或月量级估算，拆分明确后按天估算。","children":[]}]},{"id":"pmo-43","title":"计划与交付节奏","status":"归纳","note":"不同场景采用不同节奏；统一发版规则仍需按团队情境裁剪。","children":[{"id":"pmo-44","title":"三个月组织PI规划","status":"实践","note":"保时捷项目以三个月PI组织计划、资源拆解与交付协同。","children":[]},{"id":"pmo-45","title":"两周迭代按故事点交付","status":"实践","note":"保时捷项目每两周一个迭代，迭代内需求按故事点估算与交付。","children":[]},{"id":"pmo-46","title":"业务技术需求双循环","status":"实践","note":"DaDa业务每周上线、每两周一版本，技术需求每月上线，两类分开安排。","children":[]},{"id":"pmo-47","title":"统一发版前完成合并回归","status":"规则","note":"原产品开发流程规定统一发版前一天完成合并与回归；为流程规则。","children":[]}]},{"id":"pmo-48","title":"跨团队与跨系统依赖","status":"归纳","note":"协同节奏用于已知依赖的闭环，系统清单方案用于降低遗漏；二者实施状态不同。","children":[{"id":"pmo-49","title":"每周两次同步ART依赖","status":"实践","note":"保时捷ART协同每周两次同步依赖与风险。","children":[]},{"id":"pmo-50","title":"对接责任团队推动闭环","status":"实践","note":"RTE对接具体开发团队责任人，并拉通责任团队推动跨ART依赖解决。","children":[]},{"id":"pmo-51","title":"维护系统责任与上下游","status":"规则","note":"原脑图提出尝试建立系统维护信息：业务域、系统、责任人、版本、上下游、更新时间等；未证明已建成。","children":[]}]},{"id":"pmo-52","title":"风险与范围决策","status":"归纳","note":"执行风险有台账和责任跟踪，组织性问题有升级渠道；分阶段交付明确每期范围。","children":[{"id":"pmo-53","title":"风险入台账持续跟踪","status":"实践","note":"叮咚通过站会同步风险、记入风险台账并跟踪偏差。","children":[]},{"id":"pmo-54","title":"明确每期交付范围","status":"实践","note":"叮咚将项目工作拆为多期，每期明确范围；首个MVP不等于整体完工。","children":[]},{"id":"pmo-55","title":"组织问题升级HPO协同","status":"实践","note":"保时捷组织级问题同步HPO共同解决；升级阈值尚未在这些材料中给出。","children":[]},{"id":"pmo-56","title":"用容量与风险支持决策","status":"实践","note":"保时捷本人提供目标、依赖、容量、风险等信息，管理层决定业务优先级。","children":[]}]}]},{"id":"pmo-57","title":"研发交付与质量","status":"归纳","note":"将原始流程中的准入、评审、测试、发布及验收规则归为一条交付链；流程文件记录规则，不自动证明每个项目均已执行。","children":[{"id":"pmo-58","title":"需求准入与澄清","status":"归纳","note":"用文档、验收条件和参与规则降低需求理解偏差。","children":[{"id":"pmo-59","title":"PRD与验收条件明确","status":"规则","note":"PRD为必需；原型与UI/UE尽量具备。需求描述应有可测试的AC，便于产品验收；不同来源的规则合并展示。","children":[]},{"id":"pmo-60","title":"会前预读并带问题","status":"规则","note":"PRD提前与开发、测试沟通；参会者预读并带问题，会议简述背景后以答疑、确定实施方案为主，会后同步待办。","children":[]},{"id":"pmo-61","title":"统一需求分级与粒度","status":"实践","note":"原文“改进结果”记录明确线上故障、特性、故事、子任务等颗粒度；仅表示该材料自述已形成分类。","children":[]}]},{"id":"pmo-62","title":"设计与技术评审","status":"归纳","note":"按需求风险裁剪评审，同时把技术拆分、依赖和版本安排前置。","children":[{"id":"pmo-63","title":"小改动可合并评审","status":"规则","note":"设计评审可前后合并；无UI/UE改动的小调整、部分线上故障，只需澄清需求，可不单独召开设计评审。","children":[]},{"id":"pmo-64","title":"三日内接口与拆分","status":"规则","note":"该流程约定设计评审后3日内输出接口文档、拆分前后端和测试子任务，并在技术评审后确定版本；是特定流程时限。","children":[]},{"id":"pmo-65","title":"依赖与风险前置识别","status":"规则","note":"生工材料提出增加技术评审与风险评估；对系统耦合、范围和上下游影响先识别、再拆分。属于改进要求，非已完成的工程改造。","children":[]}]},{"id":"pmo-66","title":"开发测试质量门禁","status":"归纳","note":"以测试前置、环境验证、产品和设计验收共同控制准出质量。","children":[{"id":"pmo-67","title":"排期后两日用例评审","status":"规则","note":"需求评审流程规定排期结束后2日内评审测试用例，包含接口测试；核心为需求对齐。另有来源使用不同起算点和时限，不能视为全域统一SLA。","children":[]},{"id":"pmo-68","title":"冒烟与对应环境验证","status":"规则","note":"测试提供冒烟用例并在对应环境验证；提测演示可邀请产品验收。规则记录不等于所有项目已有执行证据。","children":[]},{"id":"pmo-69","title":"预发布验收与走查","status":"规则","note":"测试通知产品、设计，在预发布环境完成产品验收与设计走查；具体环节可按需求提前。","children":[]}]},{"id":"pmo-70","title":"发布验收与复盘","status":"归纳","note":"控制正常与例外发布，并把验收问题变成下一轮检查项。","children":[{"id":"pmo-71","title":"正常异常发布均留痕","status":"规则","note":"正常上线和异常上线均需测试报告、发布报告；流程设置上线验收。","children":[]},{"id":"pmo-72","title":"发版前日合并回归","status":"规则","note":"产品流程规定统一发版前一日完成合并与回归；原文有周三发版示例，具体周期仍按团队情况确定。","children":[]},{"id":"pmo-73","title":"验收问题形成检查项","status":"规则","note":"视觉问题可进小版本，功能不符先纠正再复盘根因，沉淀为后续需求检查项；这是行动项中的闭环要求。","children":[]}]}]},{"id":"pmo-74","title":"风险变更与服务保障","status":"归纳","note":"把需求变更、跨团队依赖和例外服务放进显式机制；承诺、改进方案与记录过的实践分开标记。","children":[{"id":"pmo-75","title":"需求置换与影响记录","status":"归纳","note":"通过置换、书面影响和重新排序控制临时需求。","children":[{"id":"pmo-76","title":"临时变更转需求置换","status":"实践","note":"事实母本自述把临时需求变更转为规则化需求置换；原文未给统一置换公式或完整审批矩阵。","children":[]},{"id":"pmo-77","title":"插入影响书面留痕","status":"规则","note":"插入要求导致哪些既有需求延期，应书面记录并由产品同步影响和出具排期影响。","children":[]},{"id":"pmo-78","title":"验收变更重新评审","status":"规则","note":"验收中发现需求变动，需重走需求至研发步骤；需求进行中的变动须第一时间同步产品。","children":[]}]},{"id":"pmo-79","title":"风险依赖与责任台账","status":"归纳","note":"将依赖、风险和责任信息前置，并留存可维护的记录。","children":[{"id":"pmo-80","title":"风险台账明确责任","status":"实践","note":"事实母本记录单独建立风险台账，并将跨团队依赖交给具体责任人推动闭环；属于本人经历自述。","children":[]},{"id":"pmo-81","title":"每周两次暴露依赖","status":"实践","note":"保时捷经历记录每周2次ART协同，前置同步目标、依赖和风险并推动跨ART解决；此节奏来自该经历。","children":[]},{"id":"pmo-82","title":"系统关系持续维护","status":"规则","note":"原始行动项提出建立系统维护信息，含业务域、系统、责任人、版本及上下游；CMDB为尝试方案，不标成已经建成。","children":[]}]},{"id":"pmo-83","title":"例外上线与故障保障","status":"归纳","note":"区分正常发布、加急发布和故障响应；历史承诺不作为实际履约数据。","children":[{"id":"pmo-84","title":"临时上线提出人审批","status":"规则","note":"产品流程要求临时上线由提出需求的人发起审批；没有据此补造最终审批者或授权层级。","children":[]},{"id":"pmo-85","title":"紧急需求独立小组","status":"规则","note":"原文指出高层紧急需求使迭代暂停，并提出独立小组方案；不把方案写成已落地且从未中断迭代的成果。","children":[]},{"id":"pmo-86","title":"响应时限为团队承诺","status":"规则","note":"历史原文记录可复现线上问题5分钟响应、30分钟给临时或彻底方案。这是团队承诺，非实测达成率，现行SLA需按场景另行确认。","children":[]}]},{"id":"pmo-87","title":"升级决策与开放问题","status":"归纳","note":"将组织性阻塞和未决问题交给相应决策或接管角色，不臆造通用升级阶梯。","children":[{"id":"pmo-88","title":"组织问题同步HPO","status":"实践","note":"事实母本记录将组织级问题同步HPO共同解决；仅覆盖该经历的组织问题处理路径。","children":[]},{"id":"pmo-89","title":"内部资源争议交Sponsor","status":"规则","note":"内部部门或与其他顾问间的资源协作分歧交由 Sponsor 裁决，顾问提供事实与建议；与合同争议处理区分。","children":[]},{"id":"pmo-90","title":"未决事项纳入交接","status":"规则","note":"节点二交接包保留开放问题清单，避免服务结束后遗漏仍需内部追踪的问题。","children":[]}]}]},{"id":"pmo-91","title":"度量与决策支持","status":"归纳","note":"形成目标追踪、数据口径、质量护栏与决策输入。原始目标与改进结果严格区分，历史自述数字不直接构成因果证明。","children":[{"id":"pmo-92","title":"目标层与决策信息","status":"归纳","note":"把跨团队需求聚合到目标，并向决策角色提供依赖、容量和风险信息。","children":[{"id":"pmo-93","title":"Story之上增加目标","status":"实践","note":"母本记录在Jira Story之上增加“目标”层，用于跨团队需求汇总与追踪。","children":[]},{"id":"pmo-94","title":"Jira取数并加工","status":"实践","note":"母本记录通过Jira API取数、自写部分数据处理代码，输出指标与需求全流程可视化。","children":[]},{"id":"pmo-95","title":"目标依赖容量供决策","status":"实践","note":"业务优先级由管理委员会与事业部VP决定；本人准备目标、依赖、容量和风险等信息，作为决策输入。","children":[]}]},{"id":"pmo-96","title":"基线数据与指标口径","status":"归纳","note":"以确认的指标口径表约束计算与解释。口径设计属于体系规则，不表示已经完成本期诊断。","children":[{"id":"pmo-97","title":"主周期评审后到上线","status":"规则","note":"需求开发周期从需求评审通过、进入迭代开发起算，至交付上线止；不从原始诉求提出起算。","children":[]},{"id":"pmo-98","title":"基线窗口排除共确认","status":"规则","note":"基线在诊断阶段双方共同确认；指标口径、数据来源、排除规则及观察窗口列入节点一附件指标口径表。","children":[]},{"id":"pmo-99","title":"样本与完整性须说明","status":"规则","note":"诊断说明数据完整性和样本代表性；效率判断检查范围、事项结构、数据完整性及质量，观察不直接归因。","children":[]}]},{"id":"pmo-100","title":"目标成果分别留存","status":"归纳","note":"原始脑图中的期望结果不能改写为实际成果；改进结果仍仅按材料自述保留。","children":[{"id":"pmo-101","title":"周期缩短30%至50%","status":"目标","note":"30%—50% 是期望的周期改善目标，不表示已经实现。","children":[]},{"id":"pmo-102","title":"一次成功率至少75%","status":"目标","note":"此数位于原文“期望结果”，不是已验证成功率；分母、一次成功定义及观察窗口需另行确定。","children":[]},{"id":"pmo-103","title":"会议与吞吐示意口径","status":"归纳","note":"原脑图示意口径：需求阐述时长减少50%、固定会议数减少35%、会议时长30—45分钟、示例团队周吞吐4个故事±1。尚无可核验的实测样本，不作为个人实测成绩，也不外推为全组织效果。","children":[]}]},{"id":"pmo-104","title":"质量与使用护栏","status":"归纳","note":"周期改善需与质量、机制采用情况同时观察；规划数据不直接用于个人绩效考核。","children":[{"id":"pmo-105","title":"缺陷逃逸或返工护栏","status":"规则","note":"从试点可取得的现有数据选一项质量护栏，如缺陷逃逸或返工；避免以降低质量换取周期缩短。","children":[]},{"id":"pmo-106","title":"SOP采用与独立运行","status":"规则","note":"机制采用指标可观察SOP关键步骤执行情况及内部负责人独立运行情况；用于判断机制是否可持续。","children":[]},{"id":"pmo-107","title":"团队速度不作绩效排名","status":"规则","note":"Velocity、故事点、完成事项数用于团队内部规划，不作跨个人或跨团队绩效比较；工时记录不直接作个人绩效依据。","children":[]}]}]},{"id":"pmo-108","title":"工具赋能与持续运行","status":"归纳","note":"把工具、模板、节奏和带教连接到内部接管。已有实践与试点交接规则分别标记。","children":[{"id":"pmo-109","title":"工具模板与规则统一","status":"归纳","note":"工具承载流程与字段，不以装好工具替代机制运行。","children":[{"id":"pmo-110","title":"Jira与知识资料统一","status":"实践","note":"母本记录统一Jira、Confluence方案、配置、规范及培训；顾问经历记录将需求、版本和交付记录统一到内部入口与项目工具。","children":[]},{"id":"pmo-111","title":"工单状态字段规范","status":"规则","note":"Jira培训大纲覆盖产品线、issue创建修改、状态与字段定义、迭代创建和工时填写；仅证明培训内容已形成，不补造执行覆盖率。","children":[]},{"id":"pmo-112","title":"评审发布复盘模板","status":"规则","note":"原始产品流程列出PRD、流程图、技术评审、测试报告、发布报告、复盘与数据报告模板，并由对应负责人提供。","children":[]}]},{"id":"pmo-113","title":"看板与固定运行节奏","status":"归纳","note":"用看板共享状态，通过固定会议、发版和问题处理节奏让规则日常化。","children":[{"id":"pmo-114","title":"四业务流线上物理看板","status":"实践","note":"母本记录线上看板和研发侧物理看板，呈现4条业务流需求与交付状态；这是已有经历自述。","children":[]},{"id":"pmo-115","title":"固定业产研议会","status":"实践","note":"原文改进结果记录固定业产研议会周期，讨论近期使用问题和后续业务支持；PO可按价值与依赖发起迭代计划。","children":[]},{"id":"pmo-116","title":"发版与问题处理固定","status":"实践","note":"顾问经历记录固定发版周期、日常工作流程和问题处理节奏，并形成适用于全员的行为规范。","children":[]}]},{"id":"pmo-117","title":"培训带教与能力迁移","status":"归纳","note":"将工具使用、项目方法与团队自主闭环能力一起建设。","children":[{"id":"pmo-118","title":"工具方法培训与带教","status":"实践","note":"母本记录Jira/Confluence培训及公司级项目带教。不同经历的培训范围分别保留，不相加为统一覆盖人数。","children":[]},{"id":"pmo-119","title":"团队承担端到端闭环","status":"实践","note":"凹凸经历自述约80%工作可由特性团队独立端到端完成；这是团队自主闭环能力，不是按时完成率。","children":[]},{"id":"pmo-120","title":"项目负责人自行交付","status":"实践","note":"叮咚经历记录带教后，单个项目可由团队负责人按既有流程自行交付；不等于顾问长期代任日常管理岗位。","children":[]}]},{"id":"pmo-121","title":"试点交接与内部维护","status":"归纳","note":"以内部角色、可编辑交接包和独立运行检验机制可持续。这些是交接方案的约定，不表示本期已经验收。","children":[{"id":"pmo-122","title":"内部负责人期末接管","status":"规则","note":"指定内部负责人承担日常协调、资料整合、行动跟踪并期末接管；顾问负责诊断设计与辅导，不代任内部岗位。","children":[]},{"id":"pmo-123","title":"手册模板口径交接包","status":"规则","note":"节点二交付可编辑源文件、模板、指标口径字典与指标口径表、试点修订后的SOP定稿及开放问题清单。","children":[]},{"id":"pmo-124","title":"独立复述并完成演练","status":"规则","note":"建议以内部联系人不依赖顾问、独立复述流程并完成一次演练检验交接；独立运行也是机制采用的观察项。尚无本期演练完成记录。","children":[]}]}]},{"id":"pmo-125","title":"体系建设与试点推广","status":"归纳","note":"以一个跨职能产研团队为试点，按诊断、设计、试运行、度量复盘和交接推进。示例计划分两阶段：约第1—8周完成诊断与方案，约第9—17周完成试点与交接；周次自确认的实际启动日起算。这是试点规划，不表示试点已经启动或企业级体系已经建成。","children":[{"id":"pmo-126","title":"诊断","status":"规则","note":"还原实际需求流，交叉核对角色反馈与项目证据，形成可供共同确认的问题与基线。","children":[{"id":"pmo-127","title":"事实与假设分开","status":"规则","note":"访谈项目经理、产品、研发、测试和业务，结合样本项目还原需求提出到交付的过程。报告区分事实、访谈观点和顾问判断；不确定判断标为待验证假设，并说明数据完整性与样本代表性。","children":[]},{"id":"pmo-128","title":"问题优先级共识","status":"规则","note":"重点问题清单至少记录影响、证据、优先级、建议责任人和是否进入试点；与Sponsor及业务侧共同确认关键问题和改进顺序。","children":[]},{"id":"pmo-129","title":"诊断与基线证据待补","status":"待补","note":"已读材料约定了诊断报告与基线确认，尚未见实际访谈记录、样本台账、现状流程、数据限制说明和双方确认后的基线。不能把诊断范围约定视为已完成诊断。","children":[]}]},{"id":"pmo-130","title":"设计","status":"规则","note":"共同形成治理授权、需求SOP及配套运行模板，由内部责任人承接而非顾问代任岗位。","children":[{"id":"pmo-131","title":"角色与决策授权","status":"规则","note":"Sponsor决定范围、优先级、资源和阶段继续条件；内部负责人协调资料、跟踪行动并接管机制；数据接口人确认来源和口径。顾问负责诊断、设计与辅导，不代任内部岗位。接口人的投入、Sponsor评审安排和骨干名单需在启动计划中明确。","children":[]},{"id":"pmo-132","title":"需求SOP闭环","status":"规则","note":"SOP至少覆盖需求入口、排序与优先级、执行与在制、验收、上线与发布、例外与加急；配套迭代或看板机制、完成标准、角色与决策权责及问题升级规则。","children":[]},{"id":"pmo-133","title":"运行模板与授权待补","status":"待补","note":"尚未见实际SOP、入口与澄清模板、排序规则、在制限制、验收发布清单、加急规则及确认后的权责矩阵；双方资料输入、责任人、提交时点与决策响应也需形成可用清单。","children":[]}]},{"id":"pmo-134","title":"试运行","status":"规则","note":"在单团队范围验证运行机制，以关键会议、工作坊和行动跟踪持续修正规则。","children":[{"id":"pmo-135","title":"明确试点与继续条件","status":"规则","note":"节点一书面确认团队、范围、工作节奏、主要风险、继续条件、基线和观察窗口。方案已确认且具备条件时可提前实施；新的重要发现可在既定投入内调整优先事项。","children":[]},{"id":"pmo-136","title":"会议辅导与问题闭环","status":"规则","note":"围绕迭代计划、评审与复盘等关键会议开展辅导，记录问题、依赖、受阻事项及规则调整；用同一份问题记录表跟踪风险状态和影响。","children":[]},{"id":"pmo-137","title":"执行记录与采用待补","status":"待补","note":"尚未见确认后的试点计划、会议日历、关键会议记录、行动责任与关闭记录、SOP执行证据和规则修订轨迹。内部负责人实际投入、Sponsor决策响应及跨部门授权仍需用运行记录验证。","children":[]}]},{"id":"pmo-138","title":"度量复盘","status":"规则","note":"用周期、质量和机制采用三类证据判断试点结果，保留样本限制、反例和不确定性。","children":[{"id":"pmo-139","title":"周期质量采用三指标","status":"规则","note":"主指标为需求评审通过并进入迭代开发至交付上线的周期；另选一项质量护栏及一项机制采用指标。该周期不包含需求提出、等待排序与澄清的全过程。诊断阶段共同确认基线，节点一确认指标口径、来源、排除规则和观察窗口。","children":[]},{"id":"pmo-140","title":"度量边界与解释","status":"规则","note":"团队工时用于容量规划和工作类型分析；Velocity、故事点、完成数量不用于跨个人或跨团队绩效比较。周期改善须同时检查范围、事项结构、数据完整性和质量；短期前后变化只能作方向性观察，不直接声称因果。","children":[]},{"id":"pmo-141","title":"口径表与观察结果待补","status":"待补","note":"尚未见定稿指标口径表、数值基线、质量与采用指标选择、可比样本、趋势记录或试点总结。需补充反例、质量影响和不确定性，不能仅凭周期下降宣布体系有效。","children":[]}]},{"id":"pmo-142","title":"交接与推广","status":"规则","note":"交接给内部负责人后，由管理层依据试点证据选择继续、调整、扩大或暂停。","children":[{"id":"pmo-143","title":"运行手册与交接包","status":"规则","note":"交接包含可编辑文件、一页摘要、配套模板、指标字典与口径表、试点修订后的SOP定稿、开放问题清单，明确内部负责人持续运行和维护机制。","children":[]},{"id":"pmo-144","title":"独立运行演练待补","status":"待补","note":"尚无接管清单、独立演练与能力确认记录。建议将内部人员不依赖顾问、独立复述流程并完成一次演练的场景与通过标准补入交接计划。","children":[]},{"id":"pmo-145","title":"推广按证据决策","status":"规则","note":"后续建议需列继续、调整、扩大或暂停的依据与前提。当前范围为单团队试点，扩大团队、业务线或规模化导入须另行确认；不能把单团队试点约定视为企业级全面转型完成。","children":[]}]}]}]},"count":145,"legend":{"归纳":"跨材料重新归类的体系结构，不表示同一家公司实施了全部内容","实践":"源材料的经历自述或运行记录，本次未做外部验证","规则":"流程规定、方案建议、团队承诺或试点交付约定，不表示已经实施完成","目标":"期望达到的状态或指标，不表示已经实现","待补":"缺少统一制度、实际样例或运行证据的内容"}}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('pmoData').textContent),tree=data.tree;
const svg=document.getElementById('map'),world=document.getElementById('world');
const nodes=new Map(),parents=new Map(),depths=new Map();
function index(n,parent=null,depth=0){nodes.set(n.id,n);if(parent)parents.set(n.id,parent);depths.set(n.id,depth);n.children.forEach(c=>index(c,n.id,depth+1));}index(tree);
const branchPicker=document.getElementById('branchPicker');
for(const branch of tree.children){const option=document.createElement('option');option.value=branch.id;option.textContent=branch.title;branchPicker.append(option);}
branchPicker.addEventListener('change',()=>{if(!branchPicker.value)return;const n=nodes.get(branchPicker.value);selected=n.id;showDetail(n);collapsed.delete(n.id);render(true);document.getElementById('node-details').scrollIntoView({block:'start'});});
const collapsed=new Set(), matches=new Set();let selected=tree.id,scale=1,tx=0,ty=0,bounds={x:0,y:0,w:100,h:100},positions=new Map();
const colors=['#23686b','#325a93','#70519b','#916037','#b15b49','#397a60','#627039','#566a86'];
const statusColors={'归纳':'#647471','实践':'#3b846e','规则':'#41699f','目标':'#b57c32','待补':'#ad6358'};
const ns='http://www.w3.org/2000/svg';
function el(name,attrs={},text=''){const n=document.createElementNS(ns,name);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n;}
function visibleChildren(n){return collapsed.has(n.id)?[]:n.children;}
function dimensions(n){const d=depths.get(n.id);return d===0?{w:280,h:84}:d===1?{w:244,h:67}:{w:252,h:52};}
function subtree(n){const kids=visibleChildren(n);const own=dimensions(n).h;if(!kids.length)return own;return Math.max(own,kids.reduce((sum,c)=>sum+subtree(c),0)+(kids.length-1)*16);}
function colorFor(n){let current=n;while(parents.has(current.id)&&parents.get(current.id)!==tree.id)current=nodes.get(parents.get(current.id));return colors[tree.children.indexOf(current)]||'#203d3f';}
function layout(){positions=new Map();positions.set(tree.id,{x:0,y:0,side:0});const sides=[tree.children.slice(0,4),tree.children.slice(4)];sides.forEach((branches,s)=>{const side=s===0?-1:1;const total=branches.reduce((sum,n)=>sum+subtree(n),0)+(branches.length-1)*32;let y=-total/2;for(const n of branches){place(n,side,y+subtree(n)/2,1);y+=subtree(n)+32;}});
function place(n,side,y,depth){positions.set(n.id,{x:side*(depth===1?380:380+(depth-1)*315),y,side});const kids=visibleChildren(n);if(!kids.length)return;const total=kids.reduce((sum,c)=>sum+subtree(c),0)+(kids.length-1)*16;let top=y-total/2;for(const c of kids){place(c,side,top+subtree(c)/2,depth+1);top+=subtree(c)+16;}}
let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;for(const[id,p]of positions){const dim=dimensions(nodes.get(id));x1=Math.min(x1,p.x-dim.w/2);x2=Math.max(x2,p.x+dim.w/2);y1=Math.min(y1,p.y-dim.h/2);y2=Math.max(y2,p.y+dim.h/2);}bounds={x:x1-50,y:y1-45,w:x2-x1+100,h:y2-y1+90};}
function render(autoFit=false){layout();world.replaceChildren();const edgeGroup=el('g'),nodeGroup=el('g');world.append(edgeGroup,nodeGroup);
for(const[id,p]of positions){if(id===tree.id)continue;const n=nodes.get(id),parent=nodes.get(parents.get(id)),a=positions.get(parent.id),ad=dimensions(parent),nd=dimensions(n);const ax=a.x+p.side*ad.w/2,bx=p.x-p.side*nd.w/2,mx=(ax+bx)/2;edgeGroup.append(el('path',{d:`M${ax},${a.y} C${mx},${a.y} ${mx},${p.y} ${bx},${p.y}`,fill:'none',stroke:colorFor(n),'stroke-width':depths.get(id)===1?2:1.2,opacity:.5}));}
for(const[id,p]of positions){const n=nodes.get(id),dim=dimensions(n),depth=depths.get(id);const g=el('g',{transform:`translate(${p.x-dim.w/2},${p.y-dim.h/2})`,class:'node'+(selected===id?' selected':'')+(matches.has(id)?' match':''),'data-id':id,role:'button',tabindex:'0',...(n.children.length?{'aria-expanded':String(!collapsed.has(id))}:{}),'aria-label':n.title+'，'+n.status});const bg=depth===0?'#203d3f':depth===1?'#edf3ed':'#ffffff';g.append(el('rect',{class:'card',width:dim.w,height:dim.h,rx:depth===0?13:9,fill:bg}));
if(depth===0){g.append(el('text',{x:dim.w/2,y:35,'text-anchor':'middle',fill:'#fff','font-size':24,'font-weight':600},n.title));g.append(el('text',{x:dim.w/2,y:61,'text-anchor':'middle',fill:'#d8e8e5','font-size':13},'共同规则 · 决策支持 · 团队自治'));}
else{g.append(el('circle',{cx:16,cy:depth===1?24:19,r:4,fill:statusColors[n.status]}));g.append(el('text',{x:28,y:depth===1?30:24,fill:'#203536','font-size':depth===1?17:14,'font-weight':depth===1?600:500},n.title));g.append(el('text',{x:28,y:depth===1?50:42,fill:'#697975','font-size':11},n.status+(n.children.length?' · '+n.children.length+'项':'')));}
g.addEventListener('click',()=>{selected=id;showDetail(n);render(false);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=id;showDetail(n);if(n.children.length)toggle(n.id);else render(false);world.querySelector(`[data-id="${id}"]`)?.focus();}});
if(n.children.length&&depth>0){const toggleGroup=el('g',{class:'toggle','aria-label':collapsed.has(id)?'展开':'收起'});toggleGroup.append(el('circle',{cx:dim.w-16,cy:dim.h/2,r:11,fill:'#f6f9f5',stroke:'#c5d6cc'}));toggleGroup.append(el('text',{x:dim.w-16,y:dim.h/2+5,'text-anchor':'middle',fill:'#42695f','font-size':17},collapsed.has(id)?'+':'−'));toggleGroup.addEventListener('click',e=>{e.stopPropagation();selected=id;showDetail(n);toggle(id);});g.append(toggleGroup);}nodeGroup.append(g);}
document.getElementById('count').textContent=`8个主分支 · ${data.count}个节点 · 当前显示${positions.size}个`;if(autoFit)fit();else transform();}
function transform(){world.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
function fit(){const r=svg.getBoundingClientRect();scale=Math.max(.08,Math.min(1.05,(r.width-25)/bounds.w,(r.height-65)/bounds.h));tx=r.width/2-(bounds.x+bounds.w/2)*scale;ty=r.height/2-(bounds.y+bounds.h/2)*scale;transform();}
function toggle(id){collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render(true);}
function showDetail(n){
  document.getElementById('detailStatus').textContent=n.status;
  document.getElementById('detailTitle').textContent=n.title;
  document.getElementById('detailNote').textContent=n.note||'详细说明见下级节点。';
  document.getElementById('statusNote').textContent=data.legend[n.status];
  const kids=document.getElementById('detailChildren');kids.replaceChildren();
  for(const c of n.children){const b=document.createElement('button');b.textContent=c.title+' · '+c.status;b.addEventListener('click',()=>{collapsed.delete(n.id);selected=c.id;showDetail(c);render(true);});kids.append(b);}
}
function overview(){document.getElementById('query').value='';branchPicker.value='';collapsed.clear();for(const n of nodes.values())if(depths.get(n.id)>=1&&n.children.length)collapsed.add(n.id);matches.clear();selected=tree.id;showDetail(tree);render(true);}
document.getElementById('overview').addEventListener('click',overview);document.getElementById('level2').addEventListener('click',()=>{collapsed.clear();for(const n of nodes.values())if(depths.get(n.id)>=2&&n.children.length)collapsed.add(n.id);render(true);});document.getElementById('all').addEventListener('click',()=>{collapsed.clear();render(true);});document.getElementById('fit').addEventListener('click',fit);
function zoom(factor,x=svg.clientWidth/2,y=svg.clientHeight/2){const next=Math.max(.08,Math.min(3,scale*factor)),ratio=next/scale;tx=x-(x-tx)*ratio;ty=y-(y-ty)*ratio;scale=next;transform();}
document.getElementById('plus').addEventListener('click',()=>zoom(1.25));document.getElementById('minus').addEventListener('click',()=>zoom(.8));svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('dragging');svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform();});function endDrag(){drag=null;svg.classList.remove('dragging');}svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();matches.clear();const query=document.getElementById('query').value.trim().toLowerCase();if(!query){overview();return;}for(const n of nodes.values())if((n.title+' '+n.note).toLowerCase().includes(query)){matches.add(n.id);let id=n.id;while(parents.has(id)){id=parents.get(id);collapsed.delete(id);}}if(matches.size){selected=matches.values().next().value;showDetail(nodes.get(selected));render(true);}else{render(false);document.getElementById('count').textContent='未找到匹配节点；请尝试需求、优先级、容量、指标等词。';}});
new ResizeObserver(()=>fit()).observe(svg);overview();window.PMO_TEST={data,positions,nodes,get visible(){return positions.size},get selected(){return selected}};
</script>
</body></html>
