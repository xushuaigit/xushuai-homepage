<script id="system-data" type="application/json">{"title":"PMO业产研一体化完整体系","version":"V1.0 · 体系设计与运行建议","created_at":"2026-10-10T16:41:12","positioning":"PMO作为业产研协同中枢，连接组织敏捷、数字化与交付能力。","purpose":"把材料中的经验、流程和目标整理为一套可试运行、可度量、可交接的体系。","usage_note":"本版是跨案例归纳形成的体系设计。职责、门禁、指标与模板补全均需按组织授权和风险校准，不表示某家公司已经实施全部制度。","basis_legend":{"source":"资料支持","mixed":"资料支持＋制度补全","recommendation":"制度设计建议"},"implementation_state":"设计方案，待试运行","scope":{"historical_charts":22,"historical_text_records":2203,"current_integrated_topics":36,"current_source_maps":13,"current_outline_nodes":1531,"current_flow_diagrams":5,"current_flow_objects":432,"current_flow_texts":292,"historical_only_free_summary_texts":240,"flow_topology_verified":false},"root":{"id":"PMO-SYSTEM","title":"PMO业产研一体化体系","description":"以业务可用与可持续交付为目标，由PMO准备决策信息、设计运行规则、推动跨部门协同。通过需求、优先级、容量、交付、验收、稳定性与复盘形成完整运行链。","basis":"mixed","children":[{"id":"M01","title":"定位与组织治理","description":"明确PMO的价值、服务范围、Sponsor、决策授权及组织责任；由获得授权的业务和专业角色作出取舍，PMO提供信息、规则与协同。","basis":"mixed","evidence":[],"children":[{"id":"M01-B01","title":"使命、范围与授权","description":"先定义治理要解决的业务问题、覆盖对象和决策边界，再配置PMO职责。","basis":"mixed","evidence":[],"children":[{"id":"M01-B01-L1","title":"围绕业务问题设治理目标","description":"将交付可预测性、协作成本与业务可用性列为治理目标；启动时约定观察口径，不把目标写成既有成果。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B01-L2","title":"PMO负责机制与决策信息","description":"PMO设计机制并监督运行，准备目标、依赖、容量与风险信息；协调职责不自动包含经营或技术最终决策权。","basis":"source","evidence":[],"children":[]},{"id":"M01-B01-L3","title":"章程写明范围与决策权","description":"形成PMO章程：组织范围、服务对象、授权事项、保留权、例外升级和有效期；由治理决策方批准。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B02","title":"决策权与责任链","description":"将业务排序、技术判断与交付承诺拆成独立决策，每项只有一个最终负责角色。","basis":"mixed","evidence":[],"children":[{"id":"M01-B02-L1","title":"业务优先级由业务裁定","description":"已有经历明确管理委员会与业务管理层决定业务优先级；PMO作为决策输入方。具体企业的委托边界另行确认。","basis":"source","evidence":[],"children":[]},{"id":"M01-B02-L2","title":"技术与容量由专责确认","description":"建议技术方案由技术负责人、可交付容量由交付团队负责人确认；业务优先级高不能替代技术可行性与质量判断。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B02-L3","title":"PMO提交可比较的选项","description":"用范围、时间、依赖、容量及风险描述可选方案与业务影响，提交有权角色裁定并记录理由。选项模板为补全建议。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M01-B03","title":"治理会议与决策闭环","description":"用明确议题和决策产物组织会议；会议频率按组织规模和风险约定，不把开会本身当治理成效。","basis":"recommendation","evidence":[],"children":[{"id":"M01-B03-L1","title":"按冲突与偏差进入议程","description":"跨业务流排序冲突、资源无法同时满足、关键依赖逾期或目标变化才进入需要裁定的议题；普通同步留在团队层。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B03-L2","title":"会前形成决策信息包","description":"PMO整理目标与影响、备选方案、各方容量承诺、依赖状态、风险及待决问题，区分事实、估算和假设。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B03-L3","title":"决议形成责任与行动","description":"记录唯一决策方、选择与理由、责任人、完成条件和回看时点；未决事项不能在看板上伪装为已批准承诺。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B04","title":"统一规则与业务自治","description":"公司层处理共同约束及跨流冲突，业务流保留在约束内的排序和交付自主空间。","basis":"mixed","evidence":[],"children":[{"id":"M01-B04-L1","title":"统一最小公共规则","description":"统一必要的需求、计划、依赖、风险、验收信息与字段；已有统一流程工具模板的经历支持这一方向，不要求所有团队相同做法。","basis":"mixed","evidence":[],"children":[]},{"id":"M01-B04-L2","title":"业务流在边界内自治","description":"战略方向自上而下对齐，业务流在公司约束内自主排序需求与交付时间；不能被扩大为无限自治。","basis":"source","evidence":[],"children":[]},{"id":"M01-B04-L3","title":"例外申请留理由与期限","description":"为规则例外说明适用范围、风险、补偿措施、批准角色和到期复核；规则的改动需要版本和生效通知。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B05","title":"业务团队与共享平台","description":"以业务流承担结果，以平台提供跨团队可复用能力；共享平台需要自身承接边界，不能被当作无限资源池。","basis":"mixed","evidence":[],"children":[{"id":"M01-B05-L1","title":"业务流承担交付结果","description":"相对稳定的产品、研发、测试角色纵向对齐业务流，团队直接向业务结果负责。来源为特定组织转型经历。","basis":"source","evidence":[],"children":[]},{"id":"M01-B05-L2","title":"中层从派人转为供能力","description":"材料提出中层提供能力、培养人才和支持共享复用；该角色再定位是方法观点，不能宣称所有具体组件已实施。","basis":"source","evidence":[],"children":[]},{"id":"M01-B05-L3","title":"平台用服务承诺对接","description":"建议明确平台服务目录、负责人、请求条件、容量、响应和交付承诺；跨平台争抢按公司层排序处理。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B06","title":"持续监督与内部接管","description":"治理产物需要有维护人、复核节奏和交接条件，防止只留下框架和工具配置。","basis":"mixed","evidence":[],"children":[{"id":"M01-B06-L1","title":"规则模板有维护责任人","description":"建议为制度、模板、看板口径与授权表指定内部维护人，记录版本和变更原因，定期检查过期或无用规则。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B06-L2","title":"跟踪决议与行动完成","description":"建议按决议检查行动和阻碍，而不是只汇总进度；重复未解决的问题转为组织层改进议题。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B06-L3","title":"带教后由团队自行运行","description":"已有材料记录通过项目带教沉淀方法，后续由团队负责人按既有流程自行交付。接管演练和验收清单需另行补全。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M02","title":"业务需求与优先级","description":"从业务问题和价值出发，统一需求入口、准入与颗粒度；通过公司级与业务流级排序、范围取舍和需求置换管理承诺。","basis":"mixed","evidence":[],"children":[{"id":"M02-B01","title":"战略目标到业务问题","description":"将已批准的方向和业务痛点变成可验证的需求背景，不以预设解决方案替代问题。","basis":"mixed","evidence":[],"children":[{"id":"M02-B01-L1","title":"确认目标来源与价值假设","description":"建议记录目标的批准来源、受影响用户或业务、现状证据、期望变化及不做的影响；目标值在测量口径确认后制定。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B01-L2","title":"业务先说明问题与场景","description":"原材料提出业务产品会让业务说明问题，而不是只说想要的解决方案；提前准备使用中的问题和未来支持需求。","basis":"source","evidence":[],"children":[]},{"id":"M02-B01-L3","title":"目标关联需求与验证","description":"已有目标层汇总Story的经历；建议把目标、需求、验收结果和价值回看连接起来，避免交付完成就宣称收益达成。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B02","title":"统一入口与需求准备","description":"统一记录原始诉求、澄清状态、责任人与进入排序的条件；入口接入方式按组织现有工具选择。","basis":"mixed","evidence":[],"children":[{"id":"M02-B02-L1","title":"用需求卡接收原始诉求","description":"建议需求卡包含提出人角色、业务问题、影响、目标、期望时间、约束、依赖、验收方向；信息缺口保留为待澄清。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B02-L2","title":"产品澄清并提前预警","description":"每条业务线组织需求评审、对跨团队需求提前预警的经历支持此机制；节奏和提前量按实际确认，不固定推广某个案例周期。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B02-L3","title":"准备可评审的候选库存","description":"原材料要求产品需求有库存与优先级列表；建议将已澄清候选和未澄清诉求分开，明确进入评审的准备条件。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B03","title":"公司层排序与共同约束","description":"公司层管理战略方向、跨业务流争议和共用资源冲突，不替代各业务流日常待办管理。","basis":"mixed","evidence":[],"children":[{"id":"M02-B03-L1","title":"共同确认排序原则","description":"已有材料提出全局优先级共识；价值、风险和必须性可作为讨论维度，具体算法和权重未被证明，应另行批准。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B03-L2","title":"业务管理层裁定跨流次序","description":"业务管理层决定业务优先级，PMO准备比较信息。该边界有经历支持，但具体组织的治理会议与授权人仍需明确。","basis":"source","evidence":[],"children":[]},{"id":"M02-B03-L3","title":"明确授权内与需升级事项","description":"建议公司层明确战略底线、跨流依赖和共享容量约束；业务流只有在这些边界内才能自主排序。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M02-B04","title":"业务流排序与迭代候选","description":"在公司框架下维护业务流待办；产品组织排序信息，团队用容量与依赖确认迭代可行性。","basis":"mixed","evidence":[],"children":[{"id":"M02-B04-L1","title":"产品准备价值风险排序","description":"原流程按价值、风险、优先级和必须性维护产品待办；这些维度为讨论输入，不直接等同固定评分模型。","basis":"source","evidence":[],"children":[]},{"id":"M02-B04-L2","title":"业务负责人确认流内次序","description":"建议BO在授权内最终确认业务次序，PO维护排序版本；跨流争议交公司层，PMO不代替BO选择经营优先级。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B04-L3","title":"结合容量依赖选择迭代","description":"原材料明确PO可发起迭代计划会，根据价值和依赖组成后续计划；团队容量未确认的事项先保留为候选。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B05","title":"需求置换、加急与重排","description":"让变更代价显性化，按有权角色的选择改变承诺，避免临时插入导致全部目标失真。","basis":"mixed","evidence":[],"children":[{"id":"M02-B05-L1","title":"临时变更转为需求置换","description":"已有经历将临时需求变更规则化为需求置换；具体置换审批、计算和紧急条件在原材料中不完整，需制定。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B05-L2","title":"书面记录被挤出与延期","description":"原流程要求书面记录插入导致哪些需求延期，并由产品负责人提供排期影响；由团队确认容量和依赖变化。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B05-L3","title":"回需求池重新确认承诺","description":"原流程包含回需求池重新排序；建议对取消、拆分、延后、追加容量分别记录选择，不能默认靠加班吸收。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B06","title":"决策反馈与价值回看","description":"排序是持续决策，按事实变化更新；完成需求与达到业务价值必须分开记录。","basis":"recommendation","evidence":[],"children":[{"id":"M02-B06-L1","title":"公布排序版本与变更理由","description":"建议排序记录含批准人、时间、原因、适用范围及被影响需求，并向执行团队和需求方同步。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B06-L2","title":"用计划偏差触发重排","description":"建议目标变化、关键依赖失效或容量不足时联动M04重新给出范围与时间选项；原承诺保留以便比较。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B06-L3","title":"由业务侧复核目标与收益","description":"建议由BO确认业务可用性与后续价值证据，分开管理交付完成、采用情况和目标达成；不把假设数字当实测成果。","basis":"recommendation","evidence":[],"children":[]}]}]},{"id":"M03","title":"组织敏捷与协作","description":"围绕业务流形成相对稳定的跨职能团队，明确中层、特性团队和共享平台分工；按组织规模选择团队节奏与跨团队协同。","basis":"mixed","evidence":[],"children":[{"id":"M03-B01","title":"业务流与Feature Team","description":"从临时找人交付转为稳定跨职能团队，对业务流持续负责；组织调整需先确认角色归属和覆盖范围。","basis":"mixed","evidence":[],"children":[{"id":"M03-B01-L1","title":"稳定产品研发测试角色","description":"来源记录按业务流配置相对稳定的产品、研发与测试角色。人员配置应结合业务范围与技能，不照抄案例规模。","basis":"source","evidence":[],"children":[]},{"id":"M03-B01-L2","title":"团队对业务结果负责","description":"来源记录资源池转为特性团队，团队直接对业务负责；这不意味着产品或技术决策被PMO接管。","basis":"source","evidence":[],"children":[]},{"id":"M03-B01-L3","title":"划清团队范围与共同职责","description":"建议明确团队产品边界、系统责任、接口、主负责人和共同工程职责；边界变化由授权组织角色批准。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M03-B02","title":"按任务性质选择协作模式","description":"持续产品迭代与临时跨团队集中攻坚使用不同配置，避免把Feature Team解释为每次需求临时抽人。","basis":"mixed","evidence":[],"children":[{"id":"M03-B02-L1","title":"持续产品按场景选节奏","description":"已有经历根据团队特性使用Scrum或精益看板；具体迭代、评审和验收节奏由团队场景决定。","basis":"source","evidence":[],"children":[]},{"id":"M03-B02-L2","title":"严重依赖可临时锁定人员","description":"原Feature材料提出针对跨多组、依赖严重、倒排期锁定人员开发；这是特定任务模式，不替代稳定业务团队。","basis":"source","evidence":[],"children":[]},{"id":"M03-B02-L3","title":"临时团队结束有交接安排","description":"建议集中攻坚前说明退出条件、维护归属和能力回流，避免上线后无人负责；持续产品任务保持长期责任。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M03-B03","title":"团队自治与中层再定位","description":"将可在团队内完成的技术与质量工作留给团队，把人才、跨团队复用与长期技术规划交给中层协调。","basis":"mixed","evidence":[],"children":[{"id":"M03-B03-L1","title":"授权内技术质量方案自治","description":"本人方法观点允许团队内选择技术治理、攻坚和质量方案，只要业务认可；仍需遵守组织安全和质量底线。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B03-L2","title":"中层收口人才复用与规划","description":"本人方法观点将人员归属评价、跨团队复用和技术规划交中层决策；不能据此认定所有组件和职责已逐项落地。","basis":"source","evidence":[],"children":[]},{"id":"M03-B03-L3","title":"以能力建设支持业务团队","description":"材料明确前端工程模板、测试平台与人才培养方向；通用体系建议以需求与成熟度选择能力建设项，不套同一工程方案。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M03-B04","title":"协作节奏与团队公约","description":"让计划、阻碍、评审和回顾可重复运行；用可观察行为而不是口号定义团队协作。","basis":"mixed","evidence":[],"children":[{"id":"M03-B04-L1","title":"计划会对齐价值与依赖","description":"PO可主动发起计划，团队确认目标、可选范围和依赖；具体责任与承诺检查是制度补全建议。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B04-L2","title":"用公约明确日常协作","description":"原团队成长素材提出团队公约；建议补充信息同步、需求准备、阻碍求助、评审参加和承诺变更的行为约定。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B04-L3","title":"短周期暴露风险并回顾","description":"已有站会风险同步和回顾经历；建议回顾只选择有责任人、可验证的改进行动，次周期检查效果。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M03-B05","title":"业务团队与共享平台协作","description":"平台维护共用服务，业务团队维护业务待办，两者以明确请求、供需承诺和依赖关系对接。","basis":"mixed","evidence":[],"children":[{"id":"M03-B05-L1","title":"业务流保留自主待办","description":"业务流在公司框架内自主排序，平台需求不能以技术方便直接覆盖业务优先级。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B05-L2","title":"共享平台维护承接与路线图","description":"建议平台负责人维护服务目录、平台待办、共用改进和容量边界；日常技术决策不默认交PMO。","basis":"recommendation","evidence":[],"children":[]},{"id":"M03-B05-L3","title":"平台请求显式记录上下游","description":"原流程要求知道产品模块或服务映射，并由依赖方评估风险、整理方案；响应与验收条件需双方另定。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M03-B06","title":"赋能、改进与接管","description":"先试点建立可运行习惯，再扩展到产品和业务；教练与PMO支持团队能力，而不形成持续代办依赖。","basis":"mixed","evidence":[],"children":[{"id":"M03-B06-L1","title":"从小范围迭代逐步扩展","description":"经历明确以MVP导入敏捷，先在研发建立节奏再逐步扩展产品与业务；推广条件需观察试点问题和可用性。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B06-L2","title":"结合真实交付培训带教","description":"已有项目带教和企业级工具与敏捷培训经历；建议用实际计划、依赖和风险案例训练角色，而非只讲概念。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B06-L3","title":"由内部角色接管日常机制","description":"已有材料记录团队负责人按沉淀流程自行交付；建议接管前验证角色、模板、数据维护与独立运行能力。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M04","title":"容量计划与依赖","description":"以可用容量、技术预留和依赖条件校准计划，形成有边界的交付承诺；跟踪实际偏差并及时重排范围、容量或时间。","basis":"mixed","evidence":[],"children":[{"id":"M04-B01","title":"可用供给与资源边界","description":"容量以可用人员、技能、日历和已有工作为基础；共享人力需要一个可见分配视图。","basis":"mixed","evidence":[],"children":[{"id":"M04-B01-L1","title":"确认真实可用投入","description":"建议扣除休假、培训、运营值守和已承诺工作，注明技能及关键人员约束；PMO汇总，团队确认。","basis":"recommendation","evidence":[],"children":[]},{"id":"M04-B01-L2","title":"团队供给与需求工作量匹配","description":"已有容量方案以团队总人天与需求所需人天匹配，团队结合实际落地；不能将不同团队能力视为完全可替换。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B01-L3","title":"共享人员不重复承诺","description":"人员重复占用场景提出不要满载；建议显式登记同一人员对多个团队的投入，冲突送有权角色裁定。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M04-B02","title":"估算细化与可交付拆解","description":"先粗估以支持选择，澄清后细化以支持承诺；估算的不确定性要随信息变化更新。","basis":"mixed","evidence":[],"children":[{"id":"M04-B02-L1","title":"随澄清逐级细化估算","description":"已有材料明确需求不清晰时按周月量级估算，拆分明确后按天估算；粗估须保留假设，避免假装精确。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B02-L2","title":"分期明确范围与验收结果","description":"已有经历将项目拆成多期并明确每期范围；建议每期形成可验证的使用结果，而非仅拆内部活动。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B02-L3","title":"估算单位保持团队语境","description":"有故事点估算的迭代经历；建议保留团队内部尺度，不硬换算成统一人天或用来横向评价个人效率。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M04-B03","title":"技术预留、负荷与波动","description":"显式区分业务、技术和保障投入，按中断与返工情况复核比例，防止把案例数字当通用阈值。","basis":"mixed","evidence":[],"children":[{"id":"M04-B03-L1","title":"技术预留比例按场景确定","description":"来源有整体排期预留10%—15%技术容量的案例；通用体系建议由组织批准分类原则，团队按实际调整并记录用途。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B03-L2","title":"共享占用案例建议75—80%","description":"该数字属于人员重复占用场景的负荷设计建议，并非已测负荷或全组织硬阈值；与技术预留案例不可直接拼接或相加。","basis":"source","evidence":[],"children":[]},{"id":"M04-B03-L3","title":"用中断与返工校准缓冲","description":"建议根据线上事件、临时请求、返工、等待和历史波动调整缓冲；说明分母、分类及适用周期，避免两次扣减同一容量。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M04-B04","title":"迭代节奏与联合计划","description":"单团队计划形成后再对齐多团队，按业务窗口和依赖选择规划层级，不把某种周期当企业统一要求。","basis":"mixed","evidence":[],"children":[{"id":"M04-B04-L1","title":"按任务性质确定迭代节奏","description":"有两周迭代的经历；通用体系按团队工作性质确定计划、评审和发布节奏，持续服务类工作可使用不同安排。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B04-L2","title":"多团队按需组织PI类规划","description":"有三个月PI及多团队ART规划经历；采用前需存在共同目标、相互依赖和可用责任人，不能据此等同完整LPM。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B04-L3","title":"业务与技术节奏可分别安排","description":"已有业务每周发布、双周版本和技术月度发布的双循环案例；采用时复核回归、依赖和容量，不将案例频率硬推广。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M04-B05","title":"依赖映射与供需承诺","description":"把依赖从模糊协作要求转为责任明确、可验证的供需记录；系统映射必须有人维护。","basis":"mixed","evidence":[],"children":[{"id":"M04-B05-L1","title":"维护系统责任与上下游","description":"原方案尝试维护业务域、系统、责任人、版本、上下游和更新时间；当前材料不证明已建成CMDB，需确认维护人及更新机制。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B05-L2","title":"依赖提前预警与排期","description":"来源提出提前告知排期，并由依赖方根据方案判断风险、整理解决方案；排期承诺需由供给团队确认。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B05-L3","title":"用依赖卡约定可验收供给","description":"建议每条依赖明确需求方与供给方、交付物、需要时点、供给承诺、验收条件、阻碍和升级角色，连接双方计划。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M04-B06","title":"偏差处理与决策升级","description":"发现不可兑现的承诺时，先由责任团队修复或调整；超出授权与资源边界时提交业务影响和备选方案。","basis":"mixed","evidence":[],"children":[{"id":"M04-B06-L1","title":"风险台账关联计划和责任","description":"来源记录独立风险台账、容量机制及每周两次依赖同步；节奏属于案例，通用体系按风险与规模设置。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B06-L2","title":"跨流冲突提交范围时间选项","description":"建议列出分期、置换、延期或调整资源的影响，不直接把未确认供给写成承诺；业务范围和优先级由业务决策方裁定。","basis":"recommendation","evidence":[],"children":[]},{"id":"M04-B06-L3","title":"组织问题进入治理改进","description":"有将组织问题交HPO共同解决的经历；建议按组织实际确定渠道和触发条件，不把HPO当所有企业固定岗位。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M05","title":"研发交付与质量门禁","description":"将需求、方案、开发、测试、业务验收、发布和交接贯通；通过关口产物、失败处理和例外记录控制交付风险。","basis":"mixed","evidence":[],"children":[{"id":"M05-B01","title":"需求确认与基线","description":"先确认做什么、为何做和如何验收，再承诺交付。","basis":"mixed","evidence":[],"children":[{"id":"M05-B01-L01","title":"PRD与可测试验收条件","description":"保留PRD及按AC检查的原规则；原型、UI/UE按适用性准备。","basis":"source","evidence":[],"children":[]},{"id":"M05-B01-L02","title":"预读答疑与问题关闭","description":"保留会前预读、带问题参会、以答疑确定方案及会后同步待办的规则。","basis":"source","evidence":[],"children":[]},{"id":"M05-B01-L03","title":"范围版本与追踪链","description":"建议：给需求、AC、方案、用例和版本建立关联；未决问题有负责人、期限和阻断判断。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M05-B02","title":"方案评审与风险识别","description":"技术方案需解释依赖、失败路径和交付拆分，避免只评页面。","basis":"mixed","evidence":[],"children":[{"id":"M05-B02-L01","title":"技术与依赖前置","description":"材料要求增加技术评审和风险评估；建议补安全、数据迁移、上下游影响和回滚可行性。","basis":"mixed","evidence":[],"children":[]},{"id":"M05-B02-L02","title":"接口任务与版本拆分","description":"原流程提出接口文档、前后端及测试子任务和版本确认；其3日时限仅属该流程。","basis":"source","evidence":[],"children":[]},{"id":"M05-B02-L03","title":"按风险裁剪评审","description":"小改可合并或省去单独设计评审；建议保留裁剪理由，技术与风险确认不自动免除。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M05-B03","title":"测试准备与覆盖","description":"开发开始前后持续对齐验收条件、风险和测试资源。","basis":"mixed","evidence":[],"children":[{"id":"M05-B03-L01","title":"用例覆盖验收与风险","description":"现有规则要求用例评审对齐需求并含接口测试；建议建立AC及高风险场景到用例的映射。","basis":"mixed","evidence":[],"children":[]},{"id":"M05-B03-L02","title":"环境数据与执行准备","description":"建议：记录环境版本、测试数据、接口依赖、权限与容量；未具备的条件进入阻塞台账。","basis":"recommendation","evidence":[],"children":[]},{"id":"M05-B03-L03","title":"评审时限按团队确认","description":"排期后2日、评审后2日及3工作日等口径不同；建议只确认适用团队的起算事件和截止时间。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M05-B04","title":"开发完成与提测","description":"提测意味着版本可验证，需留下同版本证据。","basis":"mixed","evidence":[],"children":[{"id":"M05-B04-L01","title":"自测与构建可追溯","description":"建议：研发提供版本、变更范围、自测结果、配置及数据变更说明，关联需求与用例。","basis":"recommendation","evidence":[],"children":[]},{"id":"M05-B04-L02","title":"对应环境冒烟","description":"原流程要求测试提供冒烟用例、对应环境冒烟成功，并安排提测演示。","basis":"source","evidence":[],"children":[]},{"id":"M05-B04-L03","title":"缺陷分级与准入","description":"建议：约定阻断缺陷与可接受风险；冒烟失败退回修复，已知缺陷不得通过遗漏来规避门禁。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M05-B05","title":"业务验收与受控发布","description":"验收结论与发布决定分开留痕，风险接受须有授权。","basis":"mixed","evidence":[],"children":[{"id":"M05-B05-L01","title":"按AC作业务验收","description":"保留AC检查、预发布产品验收与设计走查；验收失败须区分实现偏差和范围变化。","basis":"source","evidence":[],"children":[]},{"id":"M05-B05-L02","title":"合并回归与发布报告","description":"原流程要求发版前完成合并回归，正常与异常上线均有测试和发布报告；具体周期按团队确认。","basis":"source","evidence":[],"children":[]},{"id":"M05-B05-L03","title":"发布回滚与观察计划","description":"建议：发布前确认执行人、回滚触发条件、监控、业务验证和观察期；附条件发布需明确风险接受者。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M05-B06","title":"上线观察与交接结项","description":"把生产验证、接管和未决事项关闭纳入交付完成标准。","basis":"mixed","evidence":[],"children":[{"id":"M05-B06-L01","title":"生产观察与服务接管","description":"建议：观察期验证关键业务与告警，服务负责人接管运行手册、值班入口和回滚知识。","basis":"recommendation","evidence":[],"children":[]},{"id":"M05-B06-L02","title":"结项与开放事项移交","description":"已有结项报告和开放问题清单素材；建议每个未决项明确接管人、期限及风险接受，禁止无主移交。","basis":"mixed","evidence":[],"children":[]},{"id":"M05-B06-L03","title":"复盘与完成标准修订","description":"建议：对验收返工、发布失败和交付偏差记录原因、改进行动、验证结果，再修订检查项。","basis":"recommendation","evidence":[],"children":[]}]}]},{"id":"M06","title":"风险变更与稳定性","description":"把风险、阻塞、需求变化和生产事件纳入统一跟踪与升级；明确业务影响、处置责任、回退条件和关闭证据。","basis":"mixed","evidence":[],"children":[{"id":"M06-B01","title":"风险识别与台账","description":"风险需有影响、触发信号、负责人和处理期限。","basis":"mixed","evidence":[],"children":[{"id":"M06-B01-L01","title":"风险记录与责任","description":"事实母本自述建立风险台账；建议统一概率、影响、预警信号、应对动作和复查日期。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B01-L02","title":"系统依赖与维护信息","description":"原材料提出CMDB尝试方案；建议先维护系统、接口、责任角色、版本和上下游，不宣称已建成CMDB。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B01-L03","title":"分级阈值与升级触发","description":"建议：按业务影响、合规安全和交付承诺制定阈值；超过团队权限或处置期限时升级。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M06-B02","title":"需求变更与置换","description":"新增需求先说明收益、成本和对原承诺的影响，再决定插入或排队。","basis":"mixed","evidence":[],"children":[{"id":"M06-B02-L01","title":"插入影响书面留痕","description":"保留插入导致哪些需求延期须书面记录的规则；建议补受影响团队、工期、质量及版本。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B02-L02","title":"置换与优先级决定","description":"已有规则化需求置换自述；建议由有授权的业务优先级负责人决定取舍，PMO提供容量和影响信息。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B02-L03","title":"范围变动重新确认","description":"原流程要求验收中需求变动重走需求到研发步骤；建议先更新基线，再重评方案、测试与发布影响。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M06-B03","title":"依赖阻塞与升级","description":"每条跨团队依赖都有交付者、接收者、日期及关闭证据。","basis":"mixed","evidence":[],"children":[{"id":"M06-B03-L01","title":"依赖对口人与关闭证据","description":"案例由RTE对接具体团队责任人推动闭环；建议同时确认接收条件与双方关闭记录。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B03-L02","title":"协同节奏随风险调整","description":"每周两次同步是特定ART案例节奏；建议按依赖密度设置例会，紧急阻塞不等待例会。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B03-L03","title":"资源分歧按授权升级","description":"咨询方案约定内部资源协作分歧由Sponsor裁决；建议试点明确等价角色及升级时限，PMO不代行业务决策。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M06-B04","title":"例外发布与风险接受","description":"加急路径保留必要质量证据与责任，不能变为无审批直通。","basis":"mixed","evidence":[],"children":[{"id":"M06-B04-L01","title":"提出人发起加急申请","description":"原流程由需求提出者发起临时上线审批；最终批准角色未给出，需按授权另定。","basis":"source","evidence":[],"children":[]},{"id":"M06-B04-L02","title":"最小证据与风险接受","description":"建议：加急申请至少说明业务必要性、测试范围、未测项、回滚和观察；授权角色签认剩余风险。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B04-L03","title":"事后复核与补齐记录","description":"原文正常异常发布均留报告；建议加急后按约定期限复核例外、补齐记录并处理反复绕行。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M06-B05","title":"事件响应与恢复","description":"响应、给出方案和生产恢复是三个不同事件。","basis":"mixed","evidence":[],"children":[{"id":"M06-B05-L01","title":"分级指挥与协同","description":"建议：按业务影响定事件级别；指定唯一事件指挥者，统一技术处置、业务沟通和时间线。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B05-L02","title":"区分承诺与恢复目标","description":"5分钟响应、30分钟给临时或彻底方案为历史团队承诺；30分钟不等于恢复。本体系SLA按场景和能力另定。","basis":"source","evidence":[],"children":[]},{"id":"M06-B05-L03","title":"恢复验证与信息同步","description":"建议：采用止损、回滚或修复后，由业务与服务角色验证恢复；持续同步影响、进展和下一次更新时间。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M06-B06","title":"整改验证与风险关闭","description":"关闭需要验证结果，服务交接仍要承接开放风险。","basis":"mixed","evidence":[],"children":[{"id":"M06-B06-L01","title":"复盘产生可执行动作","description":"建议：关键事件和反复缺陷形成事实时间线、促成因素、动作负责人及验证方式，避免只记录口头教训。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B06-L02","title":"整改到期与效果检查","description":"建议：措施完成后验证同类风险是否降低；逾期或验证失败进入升级，不能只以任务状态判关闭。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B06-L03","title":"关闭或明确转交","description":"持续保留风险接受者和关闭依据；未关闭事项进入交接包，由接管人确认后继续追踪。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M07","title":"数字化工具与知识资产","description":"统一需求、状态、责任人和关联ID，逐步建设看板与数据取数；将规则、案例、模板和复盘沉淀为可维护的知识资产。","basis":"mixed","evidence":[],"children":[{"id":"M07.01","title":"工具最小运行底座","description":"先确认流程和信息需求，再建立最小配置；工具承载机制，不以装好软件作为体系建成。","basis":"mixed","evidence":[],"children":[{"id":"M07.01.01","title":"流程先于工具配置","description":"咨询方案讨论稿先约定需求SOP、角色权责和模板；建议在这些内容确认后配置试点工具。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.01.02","title":"统一状态与关键字段","description":"培训资料覆盖状态、字段、工单创建与迭代；应保留定义和修改责任，不能据此推定全员已规范填写。","basis":"source","evidence":[],"children":[]},{"id":"M07.01.03","title":"分阶段启用","description":"建议先启用需求入口、状态、负责人和基本看板，再按实际问题逐步增加知识空间、数据接口和自动化。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.02","title":"全局可见与数据接口","description":"把目标、需求、交付记录和取数口径关联起来；接口可用不等于治理已贯通。","basis":"mixed","evidence":[],"children":[{"id":"M07.02.01","title":"目标与需求关联","description":"经历材料记录在Story之上增加目标层，用于跨团队汇总；这是一个案例的自述，不是所有公司的统一字段模型。","basis":"source","evidence":[],"children":[]},{"id":"M07.02.02","title":"取数对象与维护","description":"资料列出issue、priority、project、user、field、version、status等接口对象，经历材料记录API取数；建议指定接口和口径维护人。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.02.03","title":"数据进入看板前检查","description":"建议核对状态时间、目标关联、责任人、重复项和缺失项，记录限制；异常数据先修复或标注再用于决策。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.03","title":"知识与模板资产","description":"按业务使用场景整理资料，并用责任人和版本管理避免模板长期失效。","basis":"mixed","evidence":[],"children":[{"id":"M07.03.01","title":"个人与团队知识空间","description":"培训材料分别列出个人空间、团队空间、JQL和需求创建；证明培训题目已形成，不证明知识使用率。","basis":"source","evidence":[],"children":[]},{"id":"M07.03.02","title":"关键交付模板","description":"产品流程列出PRD、流程图、技术评审、测试、发布、复盘和数据报告，并要求对应负责人出模板。","basis":"source","evidence":[],"children":[]},{"id":"M07.03.03","title":"资产版本与复用","description":"建议每份资产标注适用场景、owner、版本、更新时间和替代文件；保留原件，复用时检查适用范围及使用权限。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.04","title":"配置接入与运行约束","description":"把权限、通知、接口和版本问题作为可跟踪的技术约束，不能写成管理授权。","basis":"mixed","evidence":[],"children":[{"id":"M07.04.01","title":"接入阻塞保留原状态","description":"资料记录消息推送受管理员限制、AD分组需底层改造；这些是局部接入限制，不能概括为全公司工具已打通。","basis":"source","evidence":[],"children":[]},{"id":"M07.04.02","title":"配置变更先验后启用","description":"建议为字段、状态、权限和接口变更保留申请、影响、样本验证及回退记录；工具负责人确认后启用。","basis":"recommendation","evidence":[],"children":[]},{"id":"M07.04.03","title":"采购版本和访问核对","description":"建议由内部工具负责人核对授权采购、版本支持和必要访问范围；历史软件方案不直接作为当前采购或许可依据。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.05","title":"培训带教与使用支持","description":"围绕日常任务开展培训，让内部人员能自行使用和维护。","basis":"mixed","evidence":[],"children":[{"id":"M07.05.01","title":"按角色安排实操","description":"培训大纲覆盖找产品线、创建及修改工单、更改状态、创建迭代和填工时；建议按业务、产品、研发和负责人拆分实操。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.05.02","title":"带教后由团队交付","description":"经历材料记录通过项目带教沉淀方法，后续项目可由团队负责人按既有流程自行交付；这是经历自述。","basis":"source","evidence":[],"children":[]},{"id":"M07.05.03","title":"采用记录与问题支持","description":"建议记录实操结果、常见错误、支持owner及修订动作；培训人数不替代关键步骤采用率或独立运行验证。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.06","title":"数字化与AI分段实施","description":"从有业务价值的最小场景开始验证；工具建设和AI实施需要单独的范围、预算与技术责任。","basis":"mixed","evidence":[],"children":[{"id":"M07.06.01","title":"先验证再逐步扩展","description":"经历材料记录PoC验证后推动落地，以及先研发迭代再扩展业务产品协作；不能把不同案例拼成一家企业全面转型。","basis":"source","evidence":[],"children":[]},{"id":"M07.06.02","title":"AI辅助关键步骤","description":"资料沉淀需求澄清、原型、追溯、依赖及研发测试发布关卡的AI方案；建议选单一环节试用，并保留人工确认。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.06.03","title":"专项实施另行确认","description":"咨询方案讨论稿排除工具配置、部署、工具链建设和AI工具实施；需要专项授权、负责人、范围及投入，不能由顾问自动包办。","basis":"source","evidence":[],"children":[]}]}]},{"id":"M08","title":"度量决策与持续改进","description":"明确指标定义、起止点、分母、来源与观察周期，用基线和趋势支持经营、容量、质量和改进决策，并验证改进行动。","basis":"mixed","evidence":[],"children":[{"id":"M08-B01","title":"指标口径与基线","description":"先定事项粒度、起止事件、样本和排除规则，再计算改善。","basis":"mixed","evidence":[],"children":[{"id":"M08-B01-L01","title":"同类事项分层比较","description":"建议：按故事、特性及工作类型分层；不同粒度和复杂度不直接混合计算效率改善。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B01-L02","title":"周期与窗口共同确认","description":"咨询方案起点为评审通过并进入迭代开发，终点为交付上线；基线、数据来源、排除规则和观察窗口共同确认。","basis":"source","evidence":[],"children":[]},{"id":"M08-B01-L03","title":"缺失与样本偏差披露","description":"诊断须说明完整性及代表性；建议缺失项单列，不能只删去失败或未完成事项来美化结果。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M08-B02","title":"效率目标与质量护栏","description":"周期改善需同时检查质量和需求结构，不作单指标竞赛。","basis":"mixed","evidence":[],"children":[{"id":"M08-B02-L01","title":"周期缩短仍为目标","description":"30%—50%来自期望结果；建议按同口径基线和试点窗口计算，未观测前不标为成果。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B02-L02","title":"一次成功定义需确认","description":"≥75%来自期望结果；原图目标保留为KPI19待确认定义与映射，不等同推荐的KPI03首次业务验收通过率或发布稳定性指标。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B02-L03","title":"逃逸返工作质量护栏","description":"咨询方案建议从可获取的数据中选质量护栏；本稿的缺陷逃逸与返工公式为建议，避免以降质量换周期。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M08-B03","title":"流动与承诺可视化","description":"区分交付量、等待、阻塞与承诺，解释发生了什么。","basis":"mixed","evidence":[],"children":[{"id":"M08-B03-L01","title":"吞吐与工作类型","description":"保留吞吐量主题；建议以同层级完成事项数按周观察，禁止靠拆单或缩小范围提高数值。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B03-L02","title":"等待阻塞单独计时","description":"建议：记录等待开始结束、原因及依赖方，同一时间不重复累计；观察队列与在制工作，先解释再调整。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B03-L03","title":"承诺与变更并列呈现","description":"建议：保留冻结计划及后来批准的变更；延期、置换和取消分别显示，不能回改基线掩盖偏差。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M08-B04","title":"目标追踪与决策","description":"PMO准备事实与选项，授权管理角色决定优先级和资源取舍。","basis":"mixed","evidence":[],"children":[{"id":"M08-B04-L01","title":"目标连接需求与交付","description":"母本自述在Story之上增加目标层；建议目标关联收益假设、需求、责任人、验收和观察结果。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B04-L02","title":"容量依赖风险供决策","description":"母本将目标、依赖、容量和风险作为决策输入；业务优先级由有授权的管理角色决定。","basis":"source","evidence":[],"children":[]},{"id":"M08-B04-L03","title":"决策与后续验证留痕","description":"建议：每次取舍记录选项、依据、决定者、执行人和复查条件；预测与事实分开显示。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M08-B05","title":"机制采用与独立运行","description":"以具体动作和内部运行证据判断体系能否持续。","basis":"mixed","evidence":[],"children":[{"id":"M08-B05-L01","title":"SOP执行可核查","description":"咨询方案提出关键步骤执行情况；建议逐项记录适用性、完成证据、例外和负责人，而非只统计培训次数。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B05-L02","title":"内部负责人独立运行","description":"咨询方案把独立运行列为采用观察；建议选真实例行活动观察输入、决策、输出和关闭，不把出席认作掌握。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B05-L03","title":"规划指标不作个人排名","description":"工时、Velocity、故事点和完成事项数用于规划与分析，不作跨个人或跨团队绩效比较。","basis":"source","evidence":[],"children":[]}]},{"id":"M08-B06","title":"复盘实验与资料校正","description":"把指标异常变成问题、行动和下一轮验证，保留出处及不确定性。","basis":"mixed","evidence":[],"children":[{"id":"M08-B06-L01","title":"定期复盘形成行动","description":"建议：团队按迭代、管理层按月复盘；每项行动有负责人、期限、预期效果和回查日期。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B06-L02","title":"小范围试验再固化","description":"建议：先提出假设，选可比较范围，观察效率与质量护栏；验证有效再修订SOP，失败则回退或调整。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B06-L03","title":"冲突样本不作实绩指标","description":"35%会议减少存在原图与母本冲突，待核实；329为历史样本数，不能设成KPI。素材标记与实施状态分开。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M09","title":"PMO服务与内部运行","description":"通过服务目录、受理规则、运行日历、决策包和复盘管理PMO自身工作；透明跟踪承接容量、响应、服务结果与规则维护。","basis":"mixed","evidence":[],"children":[{"id":"M09.01","title":"服务目录与统一受理","description":"建议把PMO能提供的服务、边界和受理方式说明白，让支持请求可分派和关闭。","basis":"recommendation","evidence":[],"children":[{"id":"M09.01.01","title":"六类服务及边界","description":"建议目录包含治理设计、需求协同、跨团队依赖、项目风险、决策信息、培训与工具支持，并列明确不代任的职责。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.01.02","title":"受理到关闭","description":"建议每项请求保留问题、业务影响、提出人、负责服务、承接owner、期限和关闭证据；与业务需求入口使用同一ID关联。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.01.03","title":"服务变更需确认","description":"建议新增服务、临时替代岗位或建设系统时先评估工作量与授权；超出现有支持范围提交Sponsor确认。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M09.02","title":"角色授权与协作边界","description":"PMO准备信息和推动闭环；业务决策与组织授权由有权角色承担。","basis":"mixed","evidence":[],"children":[{"id":"M09.02.01","title":"管理层决定取舍","description":"经历材料将业务优先级决定权留给管理委员会和VP；咨询方案讨论稿由Sponsor确定范围、优先级、资源和是否继续。","basis":"source","evidence":[],"children":[]},{"id":"M09.02.02","title":"内部负责人持续运行","description":"咨询方案讨论稿指定内部负责人协调资料、跟踪会后行动并接管机制；数据接口人按授权提供数据并确认来源口径。","basis":"source","evidence":[],"children":[]},{"id":"M09.02.03","title":"权责与代理写清楚","description":"建议用授权表明确提案、决策、执行和知会角色及代理安排；工具管理员权限不能替代资源或业务决策权。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M09.03","title":"运行日历与团队公约","description":"根据团队问题设定稳定的工作节奏，会议必须产生可跟踪的行动或决策。","basis":"mixed","evidence":[],"children":[{"id":"M09.03.01","title":"团队日历公开协作","description":"历史团队成长资料提出团队日历、节奏和面向业务与依赖方的信息；建议落实为会议、评审、发布和响应窗口。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.03.02","title":"例会连接近期业务支持","description":"原材料记录固定业产研议会周期，讨论未来几周支持与痛点；具体频率和参加人仍需按团队场景确认。","basis":"source","evidence":[],"children":[]},{"id":"M09.03.03","title":"公约与会后行动","description":"资料提出团队公约、期望和底线；建议明确准备输入、会议产出、行动owner和关闭时间，定期取消无效会议。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M09.04","title":"决策信息与异常升级","description":"把状态、偏差、依赖和选项整理成决策输入，避免只报进度而没有待决事项。","basis":"mixed","evidence":[],"children":[{"id":"M09.04.01","title":"状态与影响同时呈现","description":"Charging原资料给PMO列出Reporting & Steering及Project Status Tracking；建议报告同步业务影响、风险和待决事项。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.04.02","title":"依赖问题有承接人","description":"经历材料记录固定同步依赖与风险，并对接开发责任人闭环；建议为跨团队事项记录承接人、目标日期与状态。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.04.03","title":"授权外事项升级","description":"咨询方案讨论稿将甲方内部跨部门分歧交给Sponsor裁决；建议在请求无法由当前owner解决时带选项和影响升级。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M09.05","title":"PMO投入与服务复盘","description":"服务工作也要有可用容量、取舍依据和改进记录，不能依赖个人长期兜底。","basis":"recommendation","evidence":[],"children":[{"id":"M09.05.01","title":"显式安排服务投入","description":"建议内部PMO按服务、项目和周期列出可用投入、已承诺工作、备份和冲突；优先做能够减少反复协调的支持。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.05.02","title":"按影响分派与置换","description":"建议支持请求按业务影响、时效及现有承诺排序；临时插入要记录被置换工作和新的确认日期。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.05.03","title":"复盘服务有效性","description":"建议检查请求关闭、行动逾期、重复问题和服务对象反馈；用流程改善减少返工，不以会议数量或工具上线量单独评价PMO。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M09.06","title":"交接接管与连续运行","description":"把方法、操作和开放问题交给内部责任人，并检验其能否独立运行。","basis":"mixed","evidence":[],"children":[{"id":"M09.06.01","title":"可编辑运行交接包","description":"咨询方案讨论稿约定可编辑文件、模板、指标口径字典、SOP定稿和开放问题清单；材料未证明本次已交接。","basis":"source","evidence":[],"children":[]},{"id":"M09.06.02","title":"独立运行演练","description":"前期决议要求无顾问协助独立复述流程并完成一次演练，后续讨论稿未原样保留最低要求；建议在实际交接计划中书面确认。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.06.03","title":"接管后维护与异常","description":"建议明确SOP、模板和数据owner、修订入口、备份及未结事项；授权、依赖和缺陷未关闭时继续跟踪而非随交接消失。","basis":"recommendation","evidence":[],"children":[]}]}]},{"id":"M10","title":"体系建设与试点推广","description":"按诊断、最小制度、试运行、度量复盘和交接推进；在一个团队跑通闭环并验证内部承接能力，再决定推广范围。","basis":"mixed","evidence":[],"children":[{"id":"M10.01","title":"现状诊断与事实核对","description":"用实际需求样本还原流程，先确认主要问题，避免把单方观点写成结论。","basis":"mixed","evidence":[],"children":[{"id":"M10.01.01","title":"访谈与项目样本交叉核对","description":"咨询方案讨论稿约定访谈业务、产品、研发、测试及项目角色，结合样本需求还原提出到交付过程，并说明样本代表性。","basis":"source","evidence":[],"children":[]},{"id":"M10.01.02","title":"事实观点假设分开","description":"咨询方案讨论稿要求区分事实、访谈观点和顾问判断，不确定判断标为待验证假设；建议每项诊断结论保留证据和反例。","basis":"mixed","evidence":[],"children":[]},{"id":"M10.01.03","title":"形成问题与限制清单","description":"咨询方案讨论稿约定记录影响、证据、优先级、建议责任人及是否进入试点；数据缺失和授权限制同时列出。","basis":"source","evidence":[],"children":[]}]},{"id":"M10.02","title":"建设目标与共识","description":"把问题、范围和观察方式对齐，不以大而全框架替代实际启动条件。","basis":"mixed","evidence":[],"children":[{"id":"M10.02.01","title":"按业务影响选先后","description":"咨询方案讨论稿要求与负责人和业务侧确认关键问题与改进优先级；建议首轮仅选择影响大且能在试点验证的问题。","basis":"mixed","evidence":[],"children":[]},{"id":"M10.02.02","title":"范围角色基线共同确认","description":"咨询方案讨论稿将试点团队、范围、节奏、主要风险、继续条件、基线和观察窗口写入节点一试点计划。","basis":"source","evidence":[],"children":[]},{"id":"M10.02.03","title":"不把目标写成成果","description":"建议把预期改善标成待验证；原图需求完成耗时缩短30%—50%、一次交付成功率75%以上均为期望，不是本期实绩，也不承诺企业级转型。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M10.03","title":"最小制度与配套模板","description":"先形成团队能执行的闭环，再按问题逐步增加制度和工具。","basis":"mixed","evidence":[],"children":[{"id":"M10.03.01","title":"需求交付SOP闭环","description":"咨询方案讨论稿至少覆盖入口、排序、执行与在制、验收、上线发布、例外加急，并配角色权责、指标口径和质量护栏。","basis":"source","evidence":[],"children":[]},{"id":"M10.03.02","title":"节奏模板共同设计","description":"建议业务、产品、研发、测试共同试填模板并演练一条需求，确认谁提供输入、谁决策、谁执行和何时升级。","basis":"recommendation","evidence":[],"children":[]},{"id":"M10.03.03","title":"按能力选择方法","description":"建议根据工作稳定性和到达方式选择迭代或看板；先建立透明度与基本协作，再评估多团队敏捷或自动化专项。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M10.04","title":"试点选择与启动条件","description":"一个可验证的试点范围，比同时宣布所有团队使用新体系更有用。","basis":"mixed","evidence":[],"children":[{"id":"M10.04.01","title":"选择可协作的跨职能团队","description":"咨询方案讨论稿暂按一个跨职能产研团队测算；历史方案建议选择有分量、配合度较高的模块，不能据此认定试点已经启动。","basis":"source","evidence":[],"children":[]},{"id":"M10.04.02","title":"关键角色与条件到位","description":"建议启动前确认Sponsor、内部负责人和数据接口人，保障可用时间、资料和决策响应；缺条件时缩小范围或顺延。","basis":"recommendation","evidence":[],"children":[]},{"id":"M10.04.03","title":"启动继续停止有条件","description":"建议把范围、数据、质量护栏和协作条件作为阶段判断依据；已确认且具备条件的改进可提前开展，重大变化重新确认。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M10.05","title":"辅导试运行与调整","description":"用真实需求跑机制，并在关键会议中解决问题和修订规则。","basis":"mixed","evidence":[],"children":[{"id":"M10.05.01","title":"计划评审复盘现场辅导","description":"咨询方案讨论稿通过工作坊、关键会议和复盘辅导团队；记录问题、依赖与规则调整，不能把参加会议等同机制有效。","basis":"source","evidence":[],"children":[]},{"id":"M10.05.02","title":"实际偏差回到规则","description":"建议记录需求插入、估算偏差、质量问题和依赖阻塞，定位输入或规则缺陷，更新检查项并验证后续是否复发。","basis":"recommendation","evidence":[],"children":[]},{"id":"M10.05.03","title":"先能运行再增加工具","description":"建议先完成若干真实事项的入口到上线闭环，再决定是否增加字段、自动提醒、接口或专项改造，避免试点被配置工作吞没。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M10.06","title":"质量度量与机制采纳","description":"以周期、质量和采用三类证据评估试点，保留样本限制和反例。","basis":"mixed","evidence":[],"children":[{"id":"M10.06.01","title":"主指标起止点明确","description":"咨询方案讨论稿主指标从需求评审通过并进入迭代开发到交付上线；不包括需求提出、澄清和等待排序全过程。","basis":"source","evidence":[],"children":[]},{"id":"M10.06.02","title":"质量与采用同时观察","description":"咨询方案讨论稿配一项质量护栏和一项机制采用指标，基线及口径、来源、排除规则和窗口在节点一确认。","basis":"source","evidence":[],"children":[]},{"id":"M10.06.03","title":"结论有样本与反例","description":"咨询方案讨论稿将短期结果作为方向观察，不声称因果；Velocity、故事点和事项数量不作跨个人或跨团队绩效比较。","basis":"source","evidence":[],"children":[]}]},{"id":"M10.07","title":"复盘交接与按证据推广","description":"管理层依据试点证据决定继续、调整、扩大或暂停，并保留内部持续运行的责任。","basis":"mixed","evidence":[],"children":[{"id":"M10.07.01","title":"文件接收与效果分开","description":"咨询方案讨论稿区分文件接收、节点成果确认和业务效果；不能将收到文档或确认节点写成效率提升已被证明。","basis":"source","evidence":[],"children":[]},{"id":"M10.07.02","title":"内部接管后再评估复制","description":"建议交接可编辑SOP、模板、口径和开放问题，完成独立运行演练，再检查新增团队的能力、授权和接口差异。","basis":"mixed","evidence":[],"children":[]},{"id":"M10.07.03","title":"90天建设观察路线","description":"建议按诊断、最小制度、试运行、复盘推广四段组织90天观察；咨询方案原17周是咨询估算，不能强行压为90天企业转型承诺。","basis":"recommendation","evidence":[],"children":[]}]}]}]},"modules":[{"id":"M01","title":"定位与组织治理","description":"明确PMO的价值、服务范围、Sponsor、决策授权及组织责任；由获得授权的业务和专业角色作出取舍，PMO提供信息、规则与协同。","basis":"mixed","evidence":[],"children":[{"id":"M01-B01","title":"使命、范围与授权","description":"先定义治理要解决的业务问题、覆盖对象和决策边界，再配置PMO职责。","basis":"mixed","evidence":[],"children":[{"id":"M01-B01-L1","title":"围绕业务问题设治理目标","description":"将交付可预测性、协作成本与业务可用性列为治理目标；启动时约定观察口径，不把目标写成既有成果。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B01-L2","title":"PMO负责机制与决策信息","description":"PMO设计机制并监督运行，准备目标、依赖、容量与风险信息；协调职责不自动包含经营或技术最终决策权。","basis":"source","evidence":[],"children":[]},{"id":"M01-B01-L3","title":"章程写明范围与决策权","description":"形成PMO章程：组织范围、服务对象、授权事项、保留权、例外升级和有效期；由治理决策方批准。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B02","title":"决策权与责任链","description":"将业务排序、技术判断与交付承诺拆成独立决策，每项只有一个最终负责角色。","basis":"mixed","evidence":[],"children":[{"id":"M01-B02-L1","title":"业务优先级由业务裁定","description":"已有经历明确管理委员会与业务管理层决定业务优先级；PMO作为决策输入方。具体企业的委托边界另行确认。","basis":"source","evidence":[],"children":[]},{"id":"M01-B02-L2","title":"技术与容量由专责确认","description":"建议技术方案由技术负责人、可交付容量由交付团队负责人确认；业务优先级高不能替代技术可行性与质量判断。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B02-L3","title":"PMO提交可比较的选项","description":"用范围、时间、依赖、容量及风险描述可选方案与业务影响，提交有权角色裁定并记录理由。选项模板为补全建议。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M01-B03","title":"治理会议与决策闭环","description":"用明确议题和决策产物组织会议；会议频率按组织规模和风险约定，不把开会本身当治理成效。","basis":"recommendation","evidence":[],"children":[{"id":"M01-B03-L1","title":"按冲突与偏差进入议程","description":"跨业务流排序冲突、资源无法同时满足、关键依赖逾期或目标变化才进入需要裁定的议题；普通同步留在团队层。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B03-L2","title":"会前形成决策信息包","description":"PMO整理目标与影响、备选方案、各方容量承诺、依赖状态、风险及待决问题，区分事实、估算和假设。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B03-L3","title":"决议形成责任与行动","description":"记录唯一决策方、选择与理由、责任人、完成条件和回看时点；未决事项不能在看板上伪装为已批准承诺。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B04","title":"统一规则与业务自治","description":"公司层处理共同约束及跨流冲突，业务流保留在约束内的排序和交付自主空间。","basis":"mixed","evidence":[],"children":[{"id":"M01-B04-L1","title":"统一最小公共规则","description":"统一必要的需求、计划、依赖、风险、验收信息与字段；已有统一流程工具模板的经历支持这一方向，不要求所有团队相同做法。","basis":"mixed","evidence":[],"children":[]},{"id":"M01-B04-L2","title":"业务流在边界内自治","description":"战略方向自上而下对齐，业务流在公司约束内自主排序需求与交付时间；不能被扩大为无限自治。","basis":"source","evidence":[],"children":[]},{"id":"M01-B04-L3","title":"例外申请留理由与期限","description":"为规则例外说明适用范围、风险、补偿措施、批准角色和到期复核；规则的改动需要版本和生效通知。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B05","title":"业务团队与共享平台","description":"以业务流承担结果，以平台提供跨团队可复用能力；共享平台需要自身承接边界，不能被当作无限资源池。","basis":"mixed","evidence":[],"children":[{"id":"M01-B05-L1","title":"业务流承担交付结果","description":"相对稳定的产品、研发、测试角色纵向对齐业务流，团队直接向业务结果负责。来源为特定组织转型经历。","basis":"source","evidence":[],"children":[]},{"id":"M01-B05-L2","title":"中层从派人转为供能力","description":"材料提出中层提供能力、培养人才和支持共享复用；该角色再定位是方法观点，不能宣称所有具体组件已实施。","basis":"source","evidence":[],"children":[]},{"id":"M01-B05-L3","title":"平台用服务承诺对接","description":"建议明确平台服务目录、负责人、请求条件、容量、响应和交付承诺；跨平台争抢按公司层排序处理。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M01-B06","title":"持续监督与内部接管","description":"治理产物需要有维护人、复核节奏和交接条件，防止只留下框架和工具配置。","basis":"mixed","evidence":[],"children":[{"id":"M01-B06-L1","title":"规则模板有维护责任人","description":"建议为制度、模板、看板口径与授权表指定内部维护人，记录版本和变更原因，定期检查过期或无用规则。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B06-L2","title":"跟踪决议与行动完成","description":"建议按决议检查行动和阻碍，而不是只汇总进度；重复未解决的问题转为组织层改进议题。","basis":"recommendation","evidence":[],"children":[]},{"id":"M01-B06-L3","title":"带教后由团队自行运行","description":"已有材料记录通过项目带教沉淀方法，后续由团队负责人按既有流程自行交付。接管演练和验收清单需另行补全。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M02","title":"业务需求与优先级","description":"从业务问题和价值出发，统一需求入口、准入与颗粒度；通过公司级与业务流级排序、范围取舍和需求置换管理承诺。","basis":"mixed","evidence":[],"children":[{"id":"M02-B01","title":"战略目标到业务问题","description":"将已批准的方向和业务痛点变成可验证的需求背景，不以预设解决方案替代问题。","basis":"mixed","evidence":[],"children":[{"id":"M02-B01-L1","title":"确认目标来源与价值假设","description":"建议记录目标的批准来源、受影响用户或业务、现状证据、期望变化及不做的影响；目标值在测量口径确认后制定。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B01-L2","title":"业务先说明问题与场景","description":"原材料提出业务产品会让业务说明问题，而不是只说想要的解决方案；提前准备使用中的问题和未来支持需求。","basis":"source","evidence":[],"children":[]},{"id":"M02-B01-L3","title":"目标关联需求与验证","description":"已有目标层汇总Story的经历；建议把目标、需求、验收结果和价值回看连接起来，避免交付完成就宣称收益达成。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B02","title":"统一入口与需求准备","description":"统一记录原始诉求、澄清状态、责任人与进入排序的条件；入口接入方式按组织现有工具选择。","basis":"mixed","evidence":[],"children":[{"id":"M02-B02-L1","title":"用需求卡接收原始诉求","description":"建议需求卡包含提出人角色、业务问题、影响、目标、期望时间、约束、依赖、验收方向；信息缺口保留为待澄清。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B02-L2","title":"产品澄清并提前预警","description":"每条业务线组织需求评审、对跨团队需求提前预警的经历支持此机制；节奏和提前量按实际确认，不固定推广某个案例周期。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B02-L3","title":"准备可评审的候选库存","description":"原材料要求产品需求有库存与优先级列表；建议将已澄清候选和未澄清诉求分开，明确进入评审的准备条件。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B03","title":"公司层排序与共同约束","description":"公司层管理战略方向、跨业务流争议和共用资源冲突，不替代各业务流日常待办管理。","basis":"mixed","evidence":[],"children":[{"id":"M02-B03-L1","title":"共同确认排序原则","description":"已有材料提出全局优先级共识；价值、风险和必须性可作为讨论维度，具体算法和权重未被证明，应另行批准。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B03-L2","title":"业务管理层裁定跨流次序","description":"业务管理层决定业务优先级，PMO准备比较信息。该边界有经历支持，但具体组织的治理会议与授权人仍需明确。","basis":"source","evidence":[],"children":[]},{"id":"M02-B03-L3","title":"明确授权内与需升级事项","description":"建议公司层明确战略底线、跨流依赖和共享容量约束；业务流只有在这些边界内才能自主排序。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M02-B04","title":"业务流排序与迭代候选","description":"在公司框架下维护业务流待办；产品组织排序信息，团队用容量与依赖确认迭代可行性。","basis":"mixed","evidence":[],"children":[{"id":"M02-B04-L1","title":"产品准备价值风险排序","description":"原流程按价值、风险、优先级和必须性维护产品待办；这些维度为讨论输入，不直接等同固定评分模型。","basis":"source","evidence":[],"children":[]},{"id":"M02-B04-L2","title":"业务负责人确认流内次序","description":"建议BO在授权内最终确认业务次序，PO维护排序版本；跨流争议交公司层，PMO不代替BO选择经营优先级。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B04-L3","title":"结合容量依赖选择迭代","description":"原材料明确PO可发起迭代计划会，根据价值和依赖组成后续计划；团队容量未确认的事项先保留为候选。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B05","title":"需求置换、加急与重排","description":"让变更代价显性化，按有权角色的选择改变承诺，避免临时插入导致全部目标失真。","basis":"mixed","evidence":[],"children":[{"id":"M02-B05-L1","title":"临时变更转为需求置换","description":"已有经历将临时需求变更规则化为需求置换；具体置换审批、计算和紧急条件在原材料中不完整，需制定。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B05-L2","title":"书面记录被挤出与延期","description":"原流程要求书面记录插入导致哪些需求延期，并由产品负责人提供排期影响；由团队确认容量和依赖变化。","basis":"mixed","evidence":[],"children":[]},{"id":"M02-B05-L3","title":"回需求池重新确认承诺","description":"原流程包含回需求池重新排序；建议对取消、拆分、延后、追加容量分别记录选择，不能默认靠加班吸收。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M02-B06","title":"决策反馈与价值回看","description":"排序是持续决策，按事实变化更新；完成需求与达到业务价值必须分开记录。","basis":"recommendation","evidence":[],"children":[{"id":"M02-B06-L1","title":"公布排序版本与变更理由","description":"建议排序记录含批准人、时间、原因、适用范围及被影响需求，并向执行团队和需求方同步。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B06-L2","title":"用计划偏差触发重排","description":"建议目标变化、关键依赖失效或容量不足时联动M04重新给出范围与时间选项；原承诺保留以便比较。","basis":"recommendation","evidence":[],"children":[]},{"id":"M02-B06-L3","title":"由业务侧复核目标与收益","description":"建议由BO确认业务可用性与后续价值证据，分开管理交付完成、采用情况和目标达成；不把假设数字当实测成果。","basis":"recommendation","evidence":[],"children":[]}]}]},{"id":"M03","title":"组织敏捷与协作","description":"围绕业务流形成相对稳定的跨职能团队，明确中层、特性团队和共享平台分工；按组织规模选择团队节奏与跨团队协同。","basis":"mixed","evidence":[],"children":[{"id":"M03-B01","title":"业务流与Feature Team","description":"从临时找人交付转为稳定跨职能团队，对业务流持续负责；组织调整需先确认角色归属和覆盖范围。","basis":"mixed","evidence":[],"children":[{"id":"M03-B01-L1","title":"稳定产品研发测试角色","description":"来源记录按业务流配置相对稳定的产品、研发与测试角色。人员配置应结合业务范围与技能，不照抄案例规模。","basis":"source","evidence":[],"children":[]},{"id":"M03-B01-L2","title":"团队对业务结果负责","description":"来源记录资源池转为特性团队，团队直接对业务负责；这不意味着产品或技术决策被PMO接管。","basis":"source","evidence":[],"children":[]},{"id":"M03-B01-L3","title":"划清团队范围与共同职责","description":"建议明确团队产品边界、系统责任、接口、主负责人和共同工程职责；边界变化由授权组织角色批准。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M03-B02","title":"按任务性质选择协作模式","description":"持续产品迭代与临时跨团队集中攻坚使用不同配置，避免把Feature Team解释为每次需求临时抽人。","basis":"mixed","evidence":[],"children":[{"id":"M03-B02-L1","title":"持续产品按场景选节奏","description":"已有经历根据团队特性使用Scrum或精益看板；具体迭代、评审和验收节奏由团队场景决定。","basis":"source","evidence":[],"children":[]},{"id":"M03-B02-L2","title":"严重依赖可临时锁定人员","description":"原Feature材料提出针对跨多组、依赖严重、倒排期锁定人员开发；这是特定任务模式，不替代稳定业务团队。","basis":"source","evidence":[],"children":[]},{"id":"M03-B02-L3","title":"临时团队结束有交接安排","description":"建议集中攻坚前说明退出条件、维护归属和能力回流，避免上线后无人负责；持续产品任务保持长期责任。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M03-B03","title":"团队自治与中层再定位","description":"将可在团队内完成的技术与质量工作留给团队，把人才、跨团队复用与长期技术规划交给中层协调。","basis":"mixed","evidence":[],"children":[{"id":"M03-B03-L1","title":"授权内技术质量方案自治","description":"本人方法观点允许团队内选择技术治理、攻坚和质量方案，只要业务认可；仍需遵守组织安全和质量底线。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B03-L2","title":"中层收口人才复用与规划","description":"本人方法观点将人员归属评价、跨团队复用和技术规划交中层决策；不能据此认定所有组件和职责已逐项落地。","basis":"source","evidence":[],"children":[]},{"id":"M03-B03-L3","title":"以能力建设支持业务团队","description":"材料明确前端工程模板、测试平台与人才培养方向；通用体系建议以需求与成熟度选择能力建设项，不套同一工程方案。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M03-B04","title":"协作节奏与团队公约","description":"让计划、阻碍、评审和回顾可重复运行；用可观察行为而不是口号定义团队协作。","basis":"mixed","evidence":[],"children":[{"id":"M03-B04-L1","title":"计划会对齐价值与依赖","description":"PO可主动发起计划，团队确认目标、可选范围和依赖；具体责任与承诺检查是制度补全建议。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B04-L2","title":"用公约明确日常协作","description":"原团队成长素材提出团队公约；建议补充信息同步、需求准备、阻碍求助、评审参加和承诺变更的行为约定。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B04-L3","title":"短周期暴露风险并回顾","description":"已有站会风险同步和回顾经历；建议回顾只选择有责任人、可验证的改进行动，次周期检查效果。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M03-B05","title":"业务团队与共享平台协作","description":"平台维护共用服务，业务团队维护业务待办，两者以明确请求、供需承诺和依赖关系对接。","basis":"mixed","evidence":[],"children":[{"id":"M03-B05-L1","title":"业务流保留自主待办","description":"业务流在公司框架内自主排序，平台需求不能以技术方便直接覆盖业务优先级。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B05-L2","title":"共享平台维护承接与路线图","description":"建议平台负责人维护服务目录、平台待办、共用改进和容量边界；日常技术决策不默认交PMO。","basis":"recommendation","evidence":[],"children":[]},{"id":"M03-B05-L3","title":"平台请求显式记录上下游","description":"原流程要求知道产品模块或服务映射，并由依赖方评估风险、整理方案；响应与验收条件需双方另定。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M03-B06","title":"赋能、改进与接管","description":"先试点建立可运行习惯，再扩展到产品和业务；教练与PMO支持团队能力，而不形成持续代办依赖。","basis":"mixed","evidence":[],"children":[{"id":"M03-B06-L1","title":"从小范围迭代逐步扩展","description":"经历明确以MVP导入敏捷，先在研发建立节奏再逐步扩展产品与业务；推广条件需观察试点问题和可用性。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B06-L2","title":"结合真实交付培训带教","description":"已有项目带教和企业级工具与敏捷培训经历；建议用实际计划、依赖和风险案例训练角色，而非只讲概念。","basis":"mixed","evidence":[],"children":[]},{"id":"M03-B06-L3","title":"由内部角色接管日常机制","description":"已有材料记录团队负责人按沉淀流程自行交付；建议接管前验证角色、模板、数据维护与独立运行能力。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M04","title":"容量计划与依赖","description":"以可用容量、技术预留和依赖条件校准计划，形成有边界的交付承诺；跟踪实际偏差并及时重排范围、容量或时间。","basis":"mixed","evidence":[],"children":[{"id":"M04-B01","title":"可用供给与资源边界","description":"容量以可用人员、技能、日历和已有工作为基础；共享人力需要一个可见分配视图。","basis":"mixed","evidence":[],"children":[{"id":"M04-B01-L1","title":"确认真实可用投入","description":"建议扣除休假、培训、运营值守和已承诺工作，注明技能及关键人员约束；PMO汇总，团队确认。","basis":"recommendation","evidence":[],"children":[]},{"id":"M04-B01-L2","title":"团队供给与需求工作量匹配","description":"已有容量方案以团队总人天与需求所需人天匹配，团队结合实际落地；不能将不同团队能力视为完全可替换。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B01-L3","title":"共享人员不重复承诺","description":"人员重复占用场景提出不要满载；建议显式登记同一人员对多个团队的投入，冲突送有权角色裁定。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M04-B02","title":"估算细化与可交付拆解","description":"先粗估以支持选择，澄清后细化以支持承诺；估算的不确定性要随信息变化更新。","basis":"mixed","evidence":[],"children":[{"id":"M04-B02-L1","title":"随澄清逐级细化估算","description":"已有材料明确需求不清晰时按周月量级估算，拆分明确后按天估算；粗估须保留假设，避免假装精确。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B02-L2","title":"分期明确范围与验收结果","description":"已有经历将项目拆成多期并明确每期范围；建议每期形成可验证的使用结果，而非仅拆内部活动。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B02-L3","title":"估算单位保持团队语境","description":"有故事点估算的迭代经历；建议保留团队内部尺度，不硬换算成统一人天或用来横向评价个人效率。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M04-B03","title":"技术预留、负荷与波动","description":"显式区分业务、技术和保障投入，按中断与返工情况复核比例，防止把案例数字当通用阈值。","basis":"mixed","evidence":[],"children":[{"id":"M04-B03-L1","title":"技术预留比例按场景确定","description":"来源有整体排期预留10%—15%技术容量的案例；通用体系建议由组织批准分类原则，团队按实际调整并记录用途。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B03-L2","title":"共享占用案例建议75—80%","description":"该数字属于人员重复占用场景的负荷设计建议，并非已测负荷或全组织硬阈值；与技术预留案例不可直接拼接或相加。","basis":"source","evidence":[],"children":[]},{"id":"M04-B03-L3","title":"用中断与返工校准缓冲","description":"建议根据线上事件、临时请求、返工、等待和历史波动调整缓冲；说明分母、分类及适用周期，避免两次扣减同一容量。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M04-B04","title":"迭代节奏与联合计划","description":"单团队计划形成后再对齐多团队，按业务窗口和依赖选择规划层级，不把某种周期当企业统一要求。","basis":"mixed","evidence":[],"children":[{"id":"M04-B04-L1","title":"按任务性质确定迭代节奏","description":"有两周迭代的经历；通用体系按团队工作性质确定计划、评审和发布节奏，持续服务类工作可使用不同安排。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B04-L2","title":"多团队按需组织PI类规划","description":"有三个月PI及多团队ART规划经历；采用前需存在共同目标、相互依赖和可用责任人，不能据此等同完整LPM。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B04-L3","title":"业务与技术节奏可分别安排","description":"已有业务每周发布、双周版本和技术月度发布的双循环案例；采用时复核回归、依赖和容量，不将案例频率硬推广。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M04-B05","title":"依赖映射与供需承诺","description":"把依赖从模糊协作要求转为责任明确、可验证的供需记录；系统映射必须有人维护。","basis":"mixed","evidence":[],"children":[{"id":"M04-B05-L1","title":"维护系统责任与上下游","description":"原方案尝试维护业务域、系统、责任人、版本、上下游和更新时间；当前材料不证明已建成CMDB，需确认维护人及更新机制。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B05-L2","title":"依赖提前预警与排期","description":"来源提出提前告知排期，并由依赖方根据方案判断风险、整理解决方案；排期承诺需由供给团队确认。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B05-L3","title":"用依赖卡约定可验收供给","description":"建议每条依赖明确需求方与供给方、交付物、需要时点、供给承诺、验收条件、阻碍和升级角色，连接双方计划。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M04-B06","title":"偏差处理与决策升级","description":"发现不可兑现的承诺时，先由责任团队修复或调整；超出授权与资源边界时提交业务影响和备选方案。","basis":"mixed","evidence":[],"children":[{"id":"M04-B06-L1","title":"风险台账关联计划和责任","description":"来源记录独立风险台账、容量机制及每周两次依赖同步；节奏属于案例，通用体系按风险与规模设置。","basis":"mixed","evidence":[],"children":[]},{"id":"M04-B06-L2","title":"跨流冲突提交范围时间选项","description":"建议列出分期、置换、延期或调整资源的影响，不直接把未确认供给写成承诺；业务范围和优先级由业务决策方裁定。","basis":"recommendation","evidence":[],"children":[]},{"id":"M04-B06-L3","title":"组织问题进入治理改进","description":"有将组织问题交HPO共同解决的经历；建议按组织实际确定渠道和触发条件，不把HPO当所有企业固定岗位。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M05","title":"研发交付与质量门禁","description":"将需求、方案、开发、测试、业务验收、发布和交接贯通；通过关口产物、失败处理和例外记录控制交付风险。","basis":"mixed","evidence":[],"children":[{"id":"M05-B01","title":"需求确认与基线","description":"先确认做什么、为何做和如何验收，再承诺交付。","basis":"mixed","evidence":[],"children":[{"id":"M05-B01-L01","title":"PRD与可测试验收条件","description":"保留PRD及按AC检查的原规则；原型、UI/UE按适用性准备。","basis":"source","evidence":[],"children":[]},{"id":"M05-B01-L02","title":"预读答疑与问题关闭","description":"保留会前预读、带问题参会、以答疑确定方案及会后同步待办的规则。","basis":"source","evidence":[],"children":[]},{"id":"M05-B01-L03","title":"范围版本与追踪链","description":"建议：给需求、AC、方案、用例和版本建立关联；未决问题有负责人、期限和阻断判断。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M05-B02","title":"方案评审与风险识别","description":"技术方案需解释依赖、失败路径和交付拆分，避免只评页面。","basis":"mixed","evidence":[],"children":[{"id":"M05-B02-L01","title":"技术与依赖前置","description":"材料要求增加技术评审和风险评估；建议补安全、数据迁移、上下游影响和回滚可行性。","basis":"mixed","evidence":[],"children":[]},{"id":"M05-B02-L02","title":"接口任务与版本拆分","description":"原流程提出接口文档、前后端及测试子任务和版本确认；其3日时限仅属该流程。","basis":"source","evidence":[],"children":[]},{"id":"M05-B02-L03","title":"按风险裁剪评审","description":"小改可合并或省去单独设计评审；建议保留裁剪理由，技术与风险确认不自动免除。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M05-B03","title":"测试准备与覆盖","description":"开发开始前后持续对齐验收条件、风险和测试资源。","basis":"mixed","evidence":[],"children":[{"id":"M05-B03-L01","title":"用例覆盖验收与风险","description":"现有规则要求用例评审对齐需求并含接口测试；建议建立AC及高风险场景到用例的映射。","basis":"mixed","evidence":[],"children":[]},{"id":"M05-B03-L02","title":"环境数据与执行准备","description":"建议：记录环境版本、测试数据、接口依赖、权限与容量；未具备的条件进入阻塞台账。","basis":"recommendation","evidence":[],"children":[]},{"id":"M05-B03-L03","title":"评审时限按团队确认","description":"排期后2日、评审后2日及3工作日等口径不同；建议只确认适用团队的起算事件和截止时间。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M05-B04","title":"开发完成与提测","description":"提测意味着版本可验证，需留下同版本证据。","basis":"mixed","evidence":[],"children":[{"id":"M05-B04-L01","title":"自测与构建可追溯","description":"建议：研发提供版本、变更范围、自测结果、配置及数据变更说明，关联需求与用例。","basis":"recommendation","evidence":[],"children":[]},{"id":"M05-B04-L02","title":"对应环境冒烟","description":"原流程要求测试提供冒烟用例、对应环境冒烟成功，并安排提测演示。","basis":"source","evidence":[],"children":[]},{"id":"M05-B04-L03","title":"缺陷分级与准入","description":"建议：约定阻断缺陷与可接受风险；冒烟失败退回修复，已知缺陷不得通过遗漏来规避门禁。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M05-B05","title":"业务验收与受控发布","description":"验收结论与发布决定分开留痕，风险接受须有授权。","basis":"mixed","evidence":[],"children":[{"id":"M05-B05-L01","title":"按AC作业务验收","description":"保留AC检查、预发布产品验收与设计走查；验收失败须区分实现偏差和范围变化。","basis":"source","evidence":[],"children":[]},{"id":"M05-B05-L02","title":"合并回归与发布报告","description":"原流程要求发版前完成合并回归，正常与异常上线均有测试和发布报告；具体周期按团队确认。","basis":"source","evidence":[],"children":[]},{"id":"M05-B05-L03","title":"发布回滚与观察计划","description":"建议：发布前确认执行人、回滚触发条件、监控、业务验证和观察期；附条件发布需明确风险接受者。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M05-B06","title":"上线观察与交接结项","description":"把生产验证、接管和未决事项关闭纳入交付完成标准。","basis":"mixed","evidence":[],"children":[{"id":"M05-B06-L01","title":"生产观察与服务接管","description":"建议：观察期验证关键业务与告警，服务负责人接管运行手册、值班入口和回滚知识。","basis":"recommendation","evidence":[],"children":[]},{"id":"M05-B06-L02","title":"结项与开放事项移交","description":"已有结项报告和开放问题清单素材；建议每个未决项明确接管人、期限及风险接受，禁止无主移交。","basis":"mixed","evidence":[],"children":[]},{"id":"M05-B06-L03","title":"复盘与完成标准修订","description":"建议：对验收返工、发布失败和交付偏差记录原因、改进行动、验证结果，再修订检查项。","basis":"recommendation","evidence":[],"children":[]}]}]},{"id":"M06","title":"风险变更与稳定性","description":"把风险、阻塞、需求变化和生产事件纳入统一跟踪与升级；明确业务影响、处置责任、回退条件和关闭证据。","basis":"mixed","evidence":[],"children":[{"id":"M06-B01","title":"风险识别与台账","description":"风险需有影响、触发信号、负责人和处理期限。","basis":"mixed","evidence":[],"children":[{"id":"M06-B01-L01","title":"风险记录与责任","description":"事实母本自述建立风险台账；建议统一概率、影响、预警信号、应对动作和复查日期。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B01-L02","title":"系统依赖与维护信息","description":"原材料提出CMDB尝试方案；建议先维护系统、接口、责任角色、版本和上下游，不宣称已建成CMDB。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B01-L03","title":"分级阈值与升级触发","description":"建议：按业务影响、合规安全和交付承诺制定阈值；超过团队权限或处置期限时升级。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M06-B02","title":"需求变更与置换","description":"新增需求先说明收益、成本和对原承诺的影响，再决定插入或排队。","basis":"mixed","evidence":[],"children":[{"id":"M06-B02-L01","title":"插入影响书面留痕","description":"保留插入导致哪些需求延期须书面记录的规则；建议补受影响团队、工期、质量及版本。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B02-L02","title":"置换与优先级决定","description":"已有规则化需求置换自述；建议由有授权的业务优先级负责人决定取舍，PMO提供容量和影响信息。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B02-L03","title":"范围变动重新确认","description":"原流程要求验收中需求变动重走需求到研发步骤；建议先更新基线，再重评方案、测试与发布影响。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M06-B03","title":"依赖阻塞与升级","description":"每条跨团队依赖都有交付者、接收者、日期及关闭证据。","basis":"mixed","evidence":[],"children":[{"id":"M06-B03-L01","title":"依赖对口人与关闭证据","description":"案例由RTE对接具体团队责任人推动闭环；建议同时确认接收条件与双方关闭记录。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B03-L02","title":"协同节奏随风险调整","description":"每周两次同步是特定ART案例节奏；建议按依赖密度设置例会，紧急阻塞不等待例会。","basis":"mixed","evidence":[],"children":[]},{"id":"M06-B03-L03","title":"资源分歧按授权升级","description":"咨询方案约定内部资源协作分歧由Sponsor裁决；建议试点明确等价角色及升级时限，PMO不代行业务决策。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M06-B04","title":"例外发布与风险接受","description":"加急路径保留必要质量证据与责任，不能变为无审批直通。","basis":"mixed","evidence":[],"children":[{"id":"M06-B04-L01","title":"提出人发起加急申请","description":"原流程由需求提出者发起临时上线审批；最终批准角色未给出，需按授权另定。","basis":"source","evidence":[],"children":[]},{"id":"M06-B04-L02","title":"最小证据与风险接受","description":"建议：加急申请至少说明业务必要性、测试范围、未测项、回滚和观察；授权角色签认剩余风险。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B04-L03","title":"事后复核与补齐记录","description":"原文正常异常发布均留报告；建议加急后按约定期限复核例外、补齐记录并处理反复绕行。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M06-B05","title":"事件响应与恢复","description":"响应、给出方案和生产恢复是三个不同事件。","basis":"mixed","evidence":[],"children":[{"id":"M06-B05-L01","title":"分级指挥与协同","description":"建议：按业务影响定事件级别；指定唯一事件指挥者，统一技术处置、业务沟通和时间线。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B05-L02","title":"区分承诺与恢复目标","description":"5分钟响应、30分钟给临时或彻底方案为历史团队承诺；30分钟不等于恢复。本体系SLA按场景和能力另定。","basis":"source","evidence":[],"children":[]},{"id":"M06-B05-L03","title":"恢复验证与信息同步","description":"建议：采用止损、回滚或修复后，由业务与服务角色验证恢复；持续同步影响、进展和下一次更新时间。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M06-B06","title":"整改验证与风险关闭","description":"关闭需要验证结果，服务交接仍要承接开放风险。","basis":"mixed","evidence":[],"children":[{"id":"M06-B06-L01","title":"复盘产生可执行动作","description":"建议：关键事件和反复缺陷形成事实时间线、促成因素、动作负责人及验证方式，避免只记录口头教训。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B06-L02","title":"整改到期与效果检查","description":"建议：措施完成后验证同类风险是否降低；逾期或验证失败进入升级，不能只以任务状态判关闭。","basis":"recommendation","evidence":[],"children":[]},{"id":"M06-B06-L03","title":"关闭或明确转交","description":"持续保留风险接受者和关闭依据；未关闭事项进入交接包，由接管人确认后继续追踪。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M07","title":"数字化工具与知识资产","description":"统一需求、状态、责任人和关联ID，逐步建设看板与数据取数；将规则、案例、模板和复盘沉淀为可维护的知识资产。","basis":"mixed","evidence":[],"children":[{"id":"M07.01","title":"工具最小运行底座","description":"先确认流程和信息需求，再建立最小配置；工具承载机制，不以装好软件作为体系建成。","basis":"mixed","evidence":[],"children":[{"id":"M07.01.01","title":"流程先于工具配置","description":"咨询方案讨论稿先约定需求SOP、角色权责和模板；建议在这些内容确认后配置试点工具。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.01.02","title":"统一状态与关键字段","description":"培训资料覆盖状态、字段、工单创建与迭代；应保留定义和修改责任，不能据此推定全员已规范填写。","basis":"source","evidence":[],"children":[]},{"id":"M07.01.03","title":"分阶段启用","description":"建议先启用需求入口、状态、负责人和基本看板，再按实际问题逐步增加知识空间、数据接口和自动化。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.02","title":"全局可见与数据接口","description":"把目标、需求、交付记录和取数口径关联起来；接口可用不等于治理已贯通。","basis":"mixed","evidence":[],"children":[{"id":"M07.02.01","title":"目标与需求关联","description":"经历材料记录在Story之上增加目标层，用于跨团队汇总；这是一个案例的自述，不是所有公司的统一字段模型。","basis":"source","evidence":[],"children":[]},{"id":"M07.02.02","title":"取数对象与维护","description":"资料列出issue、priority、project、user、field、version、status等接口对象，经历材料记录API取数；建议指定接口和口径维护人。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.02.03","title":"数据进入看板前检查","description":"建议核对状态时间、目标关联、责任人、重复项和缺失项，记录限制；异常数据先修复或标注再用于决策。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.03","title":"知识与模板资产","description":"按业务使用场景整理资料，并用责任人和版本管理避免模板长期失效。","basis":"mixed","evidence":[],"children":[{"id":"M07.03.01","title":"个人与团队知识空间","description":"培训材料分别列出个人空间、团队空间、JQL和需求创建；证明培训题目已形成，不证明知识使用率。","basis":"source","evidence":[],"children":[]},{"id":"M07.03.02","title":"关键交付模板","description":"产品流程列出PRD、流程图、技术评审、测试、发布、复盘和数据报告，并要求对应负责人出模板。","basis":"source","evidence":[],"children":[]},{"id":"M07.03.03","title":"资产版本与复用","description":"建议每份资产标注适用场景、owner、版本、更新时间和替代文件；保留原件，复用时检查适用范围及使用权限。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.04","title":"配置接入与运行约束","description":"把权限、通知、接口和版本问题作为可跟踪的技术约束，不能写成管理授权。","basis":"mixed","evidence":[],"children":[{"id":"M07.04.01","title":"接入阻塞保留原状态","description":"资料记录消息推送受管理员限制、AD分组需底层改造；这些是局部接入限制，不能概括为全公司工具已打通。","basis":"source","evidence":[],"children":[]},{"id":"M07.04.02","title":"配置变更先验后启用","description":"建议为字段、状态、权限和接口变更保留申请、影响、样本验证及回退记录；工具负责人确认后启用。","basis":"recommendation","evidence":[],"children":[]},{"id":"M07.04.03","title":"采购版本和访问核对","description":"建议由内部工具负责人核对授权采购、版本支持和必要访问范围；历史软件方案不直接作为当前采购或许可依据。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.05","title":"培训带教与使用支持","description":"围绕日常任务开展培训，让内部人员能自行使用和维护。","basis":"mixed","evidence":[],"children":[{"id":"M07.05.01","title":"按角色安排实操","description":"培训大纲覆盖找产品线、创建及修改工单、更改状态、创建迭代和填工时；建议按业务、产品、研发和负责人拆分实操。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.05.02","title":"带教后由团队交付","description":"经历材料记录通过项目带教沉淀方法，后续项目可由团队负责人按既有流程自行交付；这是经历自述。","basis":"source","evidence":[],"children":[]},{"id":"M07.05.03","title":"采用记录与问题支持","description":"建议记录实操结果、常见错误、支持owner及修订动作；培训人数不替代关键步骤采用率或独立运行验证。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M07.06","title":"数字化与AI分段实施","description":"从有业务价值的最小场景开始验证；工具建设和AI实施需要单独的范围、预算与技术责任。","basis":"mixed","evidence":[],"children":[{"id":"M07.06.01","title":"先验证再逐步扩展","description":"经历材料记录PoC验证后推动落地，以及先研发迭代再扩展业务产品协作；不能把不同案例拼成一家企业全面转型。","basis":"source","evidence":[],"children":[]},{"id":"M07.06.02","title":"AI辅助关键步骤","description":"资料沉淀需求澄清、原型、追溯、依赖及研发测试发布关卡的AI方案；建议选单一环节试用，并保留人工确认。","basis":"mixed","evidence":[],"children":[]},{"id":"M07.06.03","title":"专项实施另行确认","description":"咨询方案讨论稿排除工具配置、部署、工具链建设和AI工具实施；需要专项授权、负责人、范围及投入，不能由顾问自动包办。","basis":"source","evidence":[],"children":[]}]}]},{"id":"M08","title":"度量决策与持续改进","description":"明确指标定义、起止点、分母、来源与观察周期，用基线和趋势支持经营、容量、质量和改进决策，并验证改进行动。","basis":"mixed","evidence":[],"children":[{"id":"M08-B01","title":"指标口径与基线","description":"先定事项粒度、起止事件、样本和排除规则，再计算改善。","basis":"mixed","evidence":[],"children":[{"id":"M08-B01-L01","title":"同类事项分层比较","description":"建议：按故事、特性及工作类型分层；不同粒度和复杂度不直接混合计算效率改善。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B01-L02","title":"周期与窗口共同确认","description":"咨询方案起点为评审通过并进入迭代开发，终点为交付上线；基线、数据来源、排除规则和观察窗口共同确认。","basis":"source","evidence":[],"children":[]},{"id":"M08-B01-L03","title":"缺失与样本偏差披露","description":"诊断须说明完整性及代表性；建议缺失项单列，不能只删去失败或未完成事项来美化结果。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M08-B02","title":"效率目标与质量护栏","description":"周期改善需同时检查质量和需求结构，不作单指标竞赛。","basis":"mixed","evidence":[],"children":[{"id":"M08-B02-L01","title":"周期缩短仍为目标","description":"30%—50%来自期望结果；建议按同口径基线和试点窗口计算，未观测前不标为成果。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B02-L02","title":"一次成功定义需确认","description":"≥75%来自期望结果；原图目标保留为KPI19待确认定义与映射，不等同推荐的KPI03首次业务验收通过率或发布稳定性指标。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B02-L03","title":"逃逸返工作质量护栏","description":"咨询方案建议从可获取的数据中选质量护栏；本稿的缺陷逃逸与返工公式为建议，避免以降质量换周期。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M08-B03","title":"流动与承诺可视化","description":"区分交付量、等待、阻塞与承诺，解释发生了什么。","basis":"mixed","evidence":[],"children":[{"id":"M08-B03-L01","title":"吞吐与工作类型","description":"保留吞吐量主题；建议以同层级完成事项数按周观察，禁止靠拆单或缩小范围提高数值。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B03-L02","title":"等待阻塞单独计时","description":"建议：记录等待开始结束、原因及依赖方，同一时间不重复累计；观察队列与在制工作，先解释再调整。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B03-L03","title":"承诺与变更并列呈现","description":"建议：保留冻结计划及后来批准的变更；延期、置换和取消分别显示，不能回改基线掩盖偏差。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M08-B04","title":"目标追踪与决策","description":"PMO准备事实与选项，授权管理角色决定优先级和资源取舍。","basis":"mixed","evidence":[],"children":[{"id":"M08-B04-L01","title":"目标连接需求与交付","description":"母本自述在Story之上增加目标层；建议目标关联收益假设、需求、责任人、验收和观察结果。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B04-L02","title":"容量依赖风险供决策","description":"母本将目标、依赖、容量和风险作为决策输入；业务优先级由有授权的管理角色决定。","basis":"source","evidence":[],"children":[]},{"id":"M08-B04-L03","title":"决策与后续验证留痕","description":"建议：每次取舍记录选项、依据、决定者、执行人和复查条件；预测与事实分开显示。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M08-B05","title":"机制采用与独立运行","description":"以具体动作和内部运行证据判断体系能否持续。","basis":"mixed","evidence":[],"children":[{"id":"M08-B05-L01","title":"SOP执行可核查","description":"咨询方案提出关键步骤执行情况；建议逐项记录适用性、完成证据、例外和负责人，而非只统计培训次数。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B05-L02","title":"内部负责人独立运行","description":"咨询方案把独立运行列为采用观察；建议选真实例行活动观察输入、决策、输出和关闭，不把出席认作掌握。","basis":"mixed","evidence":[],"children":[]},{"id":"M08-B05-L03","title":"规划指标不作个人排名","description":"工时、Velocity、故事点和完成事项数用于规划与分析，不作跨个人或跨团队绩效比较。","basis":"source","evidence":[],"children":[]}]},{"id":"M08-B06","title":"复盘实验与资料校正","description":"把指标异常变成问题、行动和下一轮验证，保留出处及不确定性。","basis":"mixed","evidence":[],"children":[{"id":"M08-B06-L01","title":"定期复盘形成行动","description":"建议：团队按迭代、管理层按月复盘；每项行动有负责人、期限、预期效果和回查日期。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B06-L02","title":"小范围试验再固化","description":"建议：先提出假设，选可比较范围，观察效率与质量护栏；验证有效再修订SOP，失败则回退或调整。","basis":"recommendation","evidence":[],"children":[]},{"id":"M08-B06-L03","title":"冲突样本不作实绩指标","description":"35%会议减少存在原图与母本冲突，待核实；329为历史样本数，不能设成KPI。素材标记与实施状态分开。","basis":"mixed","evidence":[],"children":[]}]}]},{"id":"M09","title":"PMO服务与内部运行","description":"通过服务目录、受理规则、运行日历、决策包和复盘管理PMO自身工作；透明跟踪承接容量、响应、服务结果与规则维护。","basis":"mixed","evidence":[],"children":[{"id":"M09.01","title":"服务目录与统一受理","description":"建议把PMO能提供的服务、边界和受理方式说明白，让支持请求可分派和关闭。","basis":"recommendation","evidence":[],"children":[{"id":"M09.01.01","title":"六类服务及边界","description":"建议目录包含治理设计、需求协同、跨团队依赖、项目风险、决策信息、培训与工具支持，并列明确不代任的职责。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.01.02","title":"受理到关闭","description":"建议每项请求保留问题、业务影响、提出人、负责服务、承接owner、期限和关闭证据；与业务需求入口使用同一ID关联。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.01.03","title":"服务变更需确认","description":"建议新增服务、临时替代岗位或建设系统时先评估工作量与授权；超出现有支持范围提交Sponsor确认。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M09.02","title":"角色授权与协作边界","description":"PMO准备信息和推动闭环；业务决策与组织授权由有权角色承担。","basis":"mixed","evidence":[],"children":[{"id":"M09.02.01","title":"管理层决定取舍","description":"经历材料将业务优先级决定权留给管理委员会和VP；咨询方案讨论稿由Sponsor确定范围、优先级、资源和是否继续。","basis":"source","evidence":[],"children":[]},{"id":"M09.02.02","title":"内部负责人持续运行","description":"咨询方案讨论稿指定内部负责人协调资料、跟踪会后行动并接管机制；数据接口人按授权提供数据并确认来源口径。","basis":"source","evidence":[],"children":[]},{"id":"M09.02.03","title":"权责与代理写清楚","description":"建议用授权表明确提案、决策、执行和知会角色及代理安排；工具管理员权限不能替代资源或业务决策权。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M09.03","title":"运行日历与团队公约","description":"根据团队问题设定稳定的工作节奏，会议必须产生可跟踪的行动或决策。","basis":"mixed","evidence":[],"children":[{"id":"M09.03.01","title":"团队日历公开协作","description":"历史团队成长资料提出团队日历、节奏和面向业务与依赖方的信息；建议落实为会议、评审、发布和响应窗口。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.03.02","title":"例会连接近期业务支持","description":"原材料记录固定业产研议会周期，讨论未来几周支持与痛点；具体频率和参加人仍需按团队场景确认。","basis":"source","evidence":[],"children":[]},{"id":"M09.03.03","title":"公约与会后行动","description":"资料提出团队公约、期望和底线；建议明确准备输入、会议产出、行动owner和关闭时间，定期取消无效会议。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M09.04","title":"决策信息与异常升级","description":"把状态、偏差、依赖和选项整理成决策输入，避免只报进度而没有待决事项。","basis":"mixed","evidence":[],"children":[{"id":"M09.04.01","title":"状态与影响同时呈现","description":"Charging原资料给PMO列出Reporting & Steering及Project Status Tracking；建议报告同步业务影响、风险和待决事项。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.04.02","title":"依赖问题有承接人","description":"经历材料记录固定同步依赖与风险，并对接开发责任人闭环；建议为跨团队事项记录承接人、目标日期与状态。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.04.03","title":"授权外事项升级","description":"咨询方案讨论稿将甲方内部跨部门分歧交给Sponsor裁决；建议在请求无法由当前owner解决时带选项和影响升级。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M09.05","title":"PMO投入与服务复盘","description":"服务工作也要有可用容量、取舍依据和改进记录，不能依赖个人长期兜底。","basis":"recommendation","evidence":[],"children":[{"id":"M09.05.01","title":"显式安排服务投入","description":"建议内部PMO按服务、项目和周期列出可用投入、已承诺工作、备份和冲突；优先做能够减少反复协调的支持。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.05.02","title":"按影响分派与置换","description":"建议支持请求按业务影响、时效及现有承诺排序；临时插入要记录被置换工作和新的确认日期。","basis":"recommendation","evidence":[],"children":[]},{"id":"M09.05.03","title":"复盘服务有效性","description":"建议检查请求关闭、行动逾期、重复问题和服务对象反馈；用流程改善减少返工，不以会议数量或工具上线量单独评价PMO。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M09.06","title":"交接接管与连续运行","description":"把方法、操作和开放问题交给内部责任人，并检验其能否独立运行。","basis":"mixed","evidence":[],"children":[{"id":"M09.06.01","title":"可编辑运行交接包","description":"咨询方案讨论稿约定可编辑文件、模板、指标口径字典、SOP定稿和开放问题清单；材料未证明本次已交接。","basis":"source","evidence":[],"children":[]},{"id":"M09.06.02","title":"独立运行演练","description":"前期决议要求无顾问协助独立复述流程并完成一次演练，后续讨论稿未原样保留最低要求；建议在实际交接计划中书面确认。","basis":"mixed","evidence":[],"children":[]},{"id":"M09.06.03","title":"接管后维护与异常","description":"建议明确SOP、模板和数据owner、修订入口、备份及未结事项；授权、依赖和缺陷未关闭时继续跟踪而非随交接消失。","basis":"recommendation","evidence":[],"children":[]}]}]},{"id":"M10","title":"体系建设与试点推广","description":"按诊断、最小制度、试运行、度量复盘和交接推进；在一个团队跑通闭环并验证内部承接能力，再决定推广范围。","basis":"mixed","evidence":[],"children":[{"id":"M10.01","title":"现状诊断与事实核对","description":"用实际需求样本还原流程，先确认主要问题，避免把单方观点写成结论。","basis":"mixed","evidence":[],"children":[{"id":"M10.01.01","title":"访谈与项目样本交叉核对","description":"咨询方案讨论稿约定访谈业务、产品、研发、测试及项目角色，结合样本需求还原提出到交付过程，并说明样本代表性。","basis":"source","evidence":[],"children":[]},{"id":"M10.01.02","title":"事实观点假设分开","description":"咨询方案讨论稿要求区分事实、访谈观点和顾问判断，不确定判断标为待验证假设；建议每项诊断结论保留证据和反例。","basis":"mixed","evidence":[],"children":[]},{"id":"M10.01.03","title":"形成问题与限制清单","description":"咨询方案讨论稿约定记录影响、证据、优先级、建议责任人及是否进入试点；数据缺失和授权限制同时列出。","basis":"source","evidence":[],"children":[]}]},{"id":"M10.02","title":"建设目标与共识","description":"把问题、范围和观察方式对齐，不以大而全框架替代实际启动条件。","basis":"mixed","evidence":[],"children":[{"id":"M10.02.01","title":"按业务影响选先后","description":"咨询方案讨论稿要求与负责人和业务侧确认关键问题与改进优先级；建议首轮仅选择影响大且能在试点验证的问题。","basis":"mixed","evidence":[],"children":[]},{"id":"M10.02.02","title":"范围角色基线共同确认","description":"咨询方案讨论稿将试点团队、范围、节奏、主要风险、继续条件、基线和观察窗口写入节点一试点计划。","basis":"source","evidence":[],"children":[]},{"id":"M10.02.03","title":"不把目标写成成果","description":"建议把预期改善标成待验证；原图需求完成耗时缩短30%—50%、一次交付成功率75%以上均为期望，不是本期实绩，也不承诺企业级转型。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M10.03","title":"最小制度与配套模板","description":"先形成团队能执行的闭环，再按问题逐步增加制度和工具。","basis":"mixed","evidence":[],"children":[{"id":"M10.03.01","title":"需求交付SOP闭环","description":"咨询方案讨论稿至少覆盖入口、排序、执行与在制、验收、上线发布、例外加急，并配角色权责、指标口径和质量护栏。","basis":"source","evidence":[],"children":[]},{"id":"M10.03.02","title":"节奏模板共同设计","description":"建议业务、产品、研发、测试共同试填模板并演练一条需求，确认谁提供输入、谁决策、谁执行和何时升级。","basis":"recommendation","evidence":[],"children":[]},{"id":"M10.03.03","title":"按能力选择方法","description":"建议根据工作稳定性和到达方式选择迭代或看板；先建立透明度与基本协作，再评估多团队敏捷或自动化专项。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M10.04","title":"试点选择与启动条件","description":"一个可验证的试点范围，比同时宣布所有团队使用新体系更有用。","basis":"mixed","evidence":[],"children":[{"id":"M10.04.01","title":"选择可协作的跨职能团队","description":"咨询方案讨论稿暂按一个跨职能产研团队测算；历史方案建议选择有分量、配合度较高的模块，不能据此认定试点已经启动。","basis":"source","evidence":[],"children":[]},{"id":"M10.04.02","title":"关键角色与条件到位","description":"建议启动前确认Sponsor、内部负责人和数据接口人，保障可用时间、资料和决策响应；缺条件时缩小范围或顺延。","basis":"recommendation","evidence":[],"children":[]},{"id":"M10.04.03","title":"启动继续停止有条件","description":"建议把范围、数据、质量护栏和协作条件作为阶段判断依据；已确认且具备条件的改进可提前开展，重大变化重新确认。","basis":"mixed","evidence":[],"children":[]}]},{"id":"M10.05","title":"辅导试运行与调整","description":"用真实需求跑机制，并在关键会议中解决问题和修订规则。","basis":"mixed","evidence":[],"children":[{"id":"M10.05.01","title":"计划评审复盘现场辅导","description":"咨询方案讨论稿通过工作坊、关键会议和复盘辅导团队；记录问题、依赖与规则调整，不能把参加会议等同机制有效。","basis":"source","evidence":[],"children":[]},{"id":"M10.05.02","title":"实际偏差回到规则","description":"建议记录需求插入、估算偏差、质量问题和依赖阻塞，定位输入或规则缺陷，更新检查项并验证后续是否复发。","basis":"recommendation","evidence":[],"children":[]},{"id":"M10.05.03","title":"先能运行再增加工具","description":"建议先完成若干真实事项的入口到上线闭环，再决定是否增加字段、自动提醒、接口或专项改造，避免试点被配置工作吞没。","basis":"recommendation","evidence":[],"children":[]}]},{"id":"M10.06","title":"质量度量与机制采纳","description":"以周期、质量和采用三类证据评估试点，保留样本限制和反例。","basis":"mixed","evidence":[],"children":[{"id":"M10.06.01","title":"主指标起止点明确","description":"咨询方案讨论稿主指标从需求评审通过并进入迭代开发到交付上线；不包括需求提出、澄清和等待排序全过程。","basis":"source","evidence":[],"children":[]},{"id":"M10.06.02","title":"质量与采用同时观察","description":"咨询方案讨论稿配一项质量护栏和一项机制采用指标，基线及口径、来源、排除规则和窗口在节点一确认。","basis":"source","evidence":[],"children":[]},{"id":"M10.06.03","title":"结论有样本与反例","description":"咨询方案讨论稿将短期结果作为方向观察，不声称因果；Velocity、故事点和事项数量不作跨个人或跨团队绩效比较。","basis":"source","evidence":[],"children":[]}]},{"id":"M10.07","title":"复盘交接与按证据推广","description":"管理层依据试点证据决定继续、调整、扩大或暂停，并保留内部持续运行的责任。","basis":"mixed","evidence":[],"children":[{"id":"M10.07.01","title":"文件接收与效果分开","description":"咨询方案讨论稿区分文件接收、节点成果确认和业务效果；不能将收到文档或确认节点写成效率提升已被证明。","basis":"source","evidence":[],"children":[]},{"id":"M10.07.02","title":"内部接管后再评估复制","description":"建议交接可编辑SOP、模板、口径和开放问题，完成独立运行演练，再检查新增团队的能力、授权和接口差异。","basis":"mixed","evidence":[],"children":[]},{"id":"M10.07.03","title":"90天建设观察路线","description":"建议按诊断、最小制度、试运行、复盘推广四段组织90天观察；咨询方案原17周是咨询估算，不能强行压为90天企业转型承诺。","basis":"recommendation","evidence":[],"children":[]}]}]}],"mechanisms":[{"id":"M01-K01","name":"PMO章程与授权确认","module_id":"M01","trigger":"首次建设PMO，或组织范围、业务流、决策权发生重大变化时。","accountable":"SPONSOR","participants":["GOV","BO","PMO","ENG_HEAD","PLATFORM_OWNER"],"inputs":["业务问题与治理目标","组织和业务流边界","现有决策权限与保留事项","可投入的内部负责人及容量"],"steps":["PMO访谈业务与专业负责人，整理反复出现的交付和协作问题。","列明公司层、业务流、团队和平台层分别需要决定的事项。","为每项独立决策提出唯一最终负责角色；验证授权来源和代理范围。","Sponsor批准章程与资源安排；保留事项明确提交谁决定。","向各业务流发布章程，试运行后根据问题修订，保留批准版本。"],"outputs":["经授权批准的PMO章程","单项决策权责表及代理安排","内部维护人与复核时间"],"decision_rule":"Sponsor仅在其实际授权内批准；企业战略、预算等保留事项提交有权治理主体。PMO不因组织流程、管理工具或没有直属人员而自动取得或失去业务决策权。","escalation":"授权不清、角色重叠或资源承诺超出权限时，暂停该事项的承诺并提交对应上级授权人澄清。","measures":["决策事项有唯一授权角色的比例（口径先约定）","因授权不清而滞留的事项数","章程复核和例外记录完整性"],"templates":["T15","T17"],"basis":"recommendation","evidence":[],"source_boundary":"来源支持机制方向；本卡的角色、触发、流程、产物与度量是通用运行建议，尚需目标组织批准，不是已统一实施的事实。","implementation_state":"设计方案，待试运行","accountability_scope":"最终责任仅针对本卡决策规则所列范围，并按真实授权执行；各专业判断、业务验收与发布批准另按对应关口由获授权角色作出决定。"},{"id":"M01-K02","name":"治理议题与决策闭环","module_id":"M01","trigger":"跨业务流排序、共享资源冲突、目标变化或关键偏差无法在现有授权内解决时。","accountable":"GOV","participants":["BO","PO","PMO","ENG_HEAD","TEAM_LEAD","PLATFORM_OWNER"],"inputs":["业务目标和影响","需求、容量、依赖及风险事实","可比较的范围与时间选项","各受影响方意见"],"steps":["PMO登记待决事项，明确需要谁决定什么，并区分事实、估算和假设。","责任方补齐目标、容量、依赖、风险与业务影响，PMO形成一页决策包。","有权治理决策方比较选项，裁定跨流业务取舍并记录理由。","将决议拆为负责人、日期与完成证据，同步受影响业务流和团队。","PMO跟踪行动及偏差；新事实改变原假设时重新提交决定。"],"outputs":["决策记录与理由","责任明确的行动清单","更新后的业务优先级、范围和计划"],"decision_rule":"本卡的最终负责事项是跨流业务取舍。技术可行性、专业安全要求和团队容量由各授权专业角色确认；PMO只准备信息与跟踪闭环。日常会议组织服务另由PMO负责人负责。","escalation":"治理主体无法决定或超出授权时提交Sponsor/更高授权层；缺少信息时记录待补，不能将未决写成已批准承诺。","measures":["待决事项从资料齐备到决策的时长","行动按约定完成的比例","因同一阻碍反复升级的事项数"],"templates":["T07","T12","T15"],"basis":"recommendation","evidence":[],"source_boundary":"来源支持机制方向；本卡的角色、触发、流程、产物与度量是通用运行建议，尚需目标组织批准，不是已统一实施的事实。","implementation_state":"设计方案，待试运行","accountability_scope":"最终责任仅针对本卡决策规则所列范围，并按真实授权执行；各专业判断、业务验收与发布批准另按对应关口由获授权角色作出决定。"},{"id":"M01-K03","name":"业务自治与共享边界确认","module_id":"M01","trigger":"新增业务流或共享平台，或流内自治与公司共同约束发生冲突时。","accountable":"GOV","participants":["BO","PO","PMO","ENG_HEAD","TEAM_LEAD","PLATFORM_OWNER"],"inputs":["公司优先级原则与专业约束","业务流范围和结果责任","共享能力目录与可用容量","已出现的冲突和依赖"],"steps":["梳理业务流负责的需求、交付结果和团队边界。","专业负责人确认必须共用的技术、质量和运行约束，避免任意扩大统一范围。","划分流内可自主排序、需平台承接、需公司裁定三类事项。","平台和业务流明确服务入口、接口责任、承诺方式与升级路径。","治理主体批准边界和保留事项；PMO维护版本并检查实际冲突。"],"outputs":["业务流自治和保留事项清单","共享平台服务与责任目录","经批准的例外与升级规则"],"decision_rule":"业务流在公司框架内自治；跨流优先级和共享资源取舍由公司授权主体决定。平台自身技术与服务承诺由平台授权负责人作出，不把平台当无限资源池。","escalation":"公司约束与业务目标冲突时，PMO汇总影响提交GOV；技术风险须由专业授权人确认，不能仅凭业务排序覆盖。","measures":["跨层越权或重复审批的事项数","共享请求的责任与承诺完备率","边界冲突从提出到明确的时长"],"templates":["T02","T04","T15","T18"],"basis":"recommendation","evidence":[],"source_boundary":"来源支持机制方向；本卡的角色、触发、流程、产物与度量是通用运行建议，尚需目标组织批准，不是已统一实施的事实。","implementation_state":"设计方案，待试运行","accountability_scope":"最终责任仅针对本卡决策规则所列范围，并按真实授权执行；各专业判断、业务验收与发布批准另按对应关口由获授权角色作出决定。"},{"id":"M02-K01","name":"业务诉求准入与澄清","module_id":"M02","trigger":"新业务诉求、改进问题或未来需求进入候选池时。","accountable":"PO","participants":["REQUESTER","BO","TEAM_LEAD","DEPENDENCY_OWNER","PMO"],"inputs":["业务问题与影响对象","目标和预期收益假设","时效及约束","初步涉及系统和团队"],"steps":["请求方描述业务痛点和使用问题；PO先澄清问题，不把指定解决方案直接当已批准需求。","补齐价值假设、验收方向、时效和关键约束，记录信息缺口及补充责任人。","团队以粗粒度判断规模、技术可行性和可能依赖；不清晰项先标估算区间。","提前邀请受影响团队和平台核对依赖及准备条件。","PO确认可进入候选池的准备程度；业务排序和交付承诺仍进入后续独立决策。"],"outputs":["可审议的需求单","初步依赖与估算区间","准备不足项和补充责任人"],"decision_rule":"PO负责需求信息准备。准入只表示信息达到约定程度，不等于公司优先级、预算或团队排期已批准；紧急项也需记录缺口和补偿措施。","escalation":"价值目标有争议提交BO澄清；存在公司级优先级或跨流冲突时提交GOV；未知专业风险提交相应专业负责人。","measures":["因信息不足退回澄清的比例","从诉求提出到资料可审议的时长","排期前识别到的跨团队依赖占比"],"templates":["T01","T04"],"basis":"recommendation","evidence":[],"source_boundary":"来源支持机制方向；本卡的角色、触发、流程、产物与度量是通用运行建议，尚需目标组织批准，不是已统一实施的事实。","implementation_state":"设计方案，待试运行","accountability_scope":"最终责任仅针对本卡决策规则所列范围，并按真实授权执行；各专业判断、业务验收与发布批准另按对应关口由获授权角色作出决定。"},{"id":"M02-K02","name":"公司层优先级与跨流裁定","module_id":"M02","trigger":"公司战略调整、跨业务流需求竞争或共享容量无法同时满足时。","accountable":"GOV","participants":["BO","PO","PMO","ENG_HEAD","PLATFORM_OWNER","TEAM_LEAD"],"inputs":["公司目标与保留事项","候选需求的业务价值、时效和风险","各业务流及共享团队容量","依赖和延期影响"],"steps":["管理层明确公司目标、硬约束和优先级原则，形成可解释的共同语言。","PO与BO提供候选需求的业务理由；专业与交付角色核实风险、依赖和容量。","PMO展示冲突、选项及影响，区分公司层取舍与流内具体排序。","GOV在授权内裁定公司优先级、资源约束和跨流冲突，记录决定及理由。","向业务流发布公司框架和本轮约束，由各流在边界内自主排序；目标变化时复核。"],"outputs":["公司层优先级原则和约束","跨流裁定记录","可供流内排序的边界条件"],"decision_rule":"公司层业务取舍最终由有权管理决策主体承担；PMO不默认有经营或预算最终权。评分方法可辅助比较，现有材料不能证明已采用统一WSJF、全组合预算或LPM制度。","escalation":"超出管理主体的预算/战略权限时提交Sponsor或企业实际保留权人；专业风险无法接受时先记录限制再选择范围或时间方案。","measures":["跨流裁定等待时长","优先级理由与容量信息的完整性","因战略约束不清造成的返工事项数"],"templates":["T02","T03","T04","T07"],"basis":"recommendation","evidence":[],"source_boundary":"来源支持机制方向；本卡的角色、触发、流程、产物与度量是通用运行建议，尚需目标组织批准，不是已统一实施的事实。","implementation_state":"设计方案，待试运行","accountability_scope":"最终责任仅针对本卡决策规则所列范围，并按真实授权执行；各专业判断、业务验收与发布批准另按对应关口由获授权角色作出决定。"},{"id":"M02-K03","name":"流内排序与需求置换","module_i
